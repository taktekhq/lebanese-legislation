# Development: the whole site from one image, on http://localhost:8080.
# The same -all image runs in production; there, the Cloudflare Worker serves
# static pages from R2 and only sends the API, MCP and search to it. Here the
# image renders every page on request, which is slower but needs nothing else.
#
#   docker compose -f compose.dev.yaml up
#
# Search by meaning and the AI answers need GEMINI_API_KEY (and, for the
# passage vectors, LEBLEG_VECTORIZE_* or your own pgvector); everything else
# works without keys.
name: ${COMPOSE_PROJECT_NAME:-lebanese-legislation-dev}
services:
  all:
    image: ${ALL_IMAGE:-ghcr.io/taktekhq/lebanese-legislation-all:latest}
    ports: ["127.0.0.1:${PORT:-8080}:8080"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      LEBLEG_VECTORIZE_TOKEN: ${LEBLEG_VECTORIZE_TOKEN:-}
      LEBLEG_VECTORIZE_INDEX: ${LEBLEG_VECTORIZE_INDEX:-}
    shm_size: 1gb
    restart: unless-stopped
