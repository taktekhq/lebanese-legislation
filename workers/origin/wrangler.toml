main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

[env.blue]
name = "lebleg-origin-blue"
workers_dev = false
vars = { LEBLEG_VECTORIZE_INDEX = "lebleg-chunks", CLOUDFLARE_ACCOUNT_ID = "5f012a200d9622ea6aecef1a02693e26", POSTHOG_KEY = "phc_pTpSY5wVsQrG8LN58z4zWXdMWjvqR6uPCY2eXV25sBV5", LEBLEG_SEARCH_PROVIDER = "gemini", LEBLEG_SEARCH_MODEL = "gemini-3.1-flash-lite", LEBLEG_SEARCH_SELECT_MODEL = "gemini-3.8-flash", LEBLEG_SEARCH_DAILY_LIMIT = "4000", LEBLEG_SEARCH_SHARES_DATA = "0" }

[[env.blue.containers]]
class_name = "Origin"
image = "../static-site/container/Dockerfile"
image_build_context = "../static-site/container"
instance_type = "standard-4"
max_instances = 2

[[env.blue.durable_objects.bindings]]
name = "ORIGIN"
class_name = "Origin"

[[env.blue.migrations]]
tag = "v1"
new_sqlite_classes = ["Origin"]

[env.green]
name = "lebleg-origin-green"
workers_dev = false
vars = { LEBLEG_VECTORIZE_INDEX = "lebleg-chunks", CLOUDFLARE_ACCOUNT_ID = "5f012a200d9622ea6aecef1a02693e26", POSTHOG_KEY = "phc_pTpSY5wVsQrG8LN58z4zWXdMWjvqR6uPCY2eXV25sBV5", LEBLEG_SEARCH_PROVIDER = "gemini", LEBLEG_SEARCH_MODEL = "gemini-3.1-flash-lite", LEBLEG_SEARCH_SELECT_MODEL = "gemini-3.8-flash", LEBLEG_SEARCH_DAILY_LIMIT = "4000", LEBLEG_SEARCH_SHARES_DATA = "0" }

[[env.green.containers]]
class_name = "Origin"
image = "../static-site/container/Dockerfile"
