name = "lebleg-static-site"
main = "src/index.js"
compatibility_date = "2026-10-01"
# The Worker answers on workers.dev until routes are attached. Routes are added
# one at a time with `wrangler deploy --route "lebaneselegislation.com/law/*"`
# (the workflow takes them as an input); removing a route returns that path to
# the live origin. Keep any `routes = [...]` above the first [table].
workers_dev = true

vars = { ORIGIN_MODE = "container", POSTHOG_KEY = "phc_pTpSY5wVsQrG8LN58z4zWXdMWjvqR6uPCY2eXV25sBV5" }

[[services]]
binding = "ORIGIN_BLUE"
service = "lebleg-origin-blue"

[[services]]
binding = "ORIGIN_GREEN"
service = "lebleg-origin-green"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Origin"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["OriginBlue", "OriginGreen"]

[[r2_buckets]]
binding = "SITE"
bucket_name = "lebleg-site"

[observability]
enabled = true
