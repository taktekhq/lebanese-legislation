name = "lebleg-static-site"
main = "src/index.js"
compatibility_date = "2026-10-01"
# The Worker answers on workers.dev until routes are attached. Routes are added
# one at a time with `wrangler deploy --route "lebaneselegislation.com/law/*"`
# (the workflow takes them as an input); removing a route returns that path to
# the live origin. Keep any `routes = [...]` above the first [table].
workers_dev = true

vars = { ORIGIN_MODE = "hetzner", POSTHOG_KEY = "phc_pTpSY5wVsQrG8LN58z4zWXdMWjvqR6uPCY2eXV25sBV5", LEBLEG_SEARCH_PROVIDER = "gemini", LEBLEG_SEARCH_MODEL = "gemini-3.1-flash-lite", LEBLEG_SEARCH_SELECT_MODEL = "gemini-3.8-flash", LEBLEG_SEARCH_DAILY_LIMIT = "500", LEBLEG_SEARCH_SHARES_DATA = "0" }

[[containers]]
class_name = "Origin"
image = "./container/Dockerfile"
image_build_context = "./container"
max_instances = 1
instance_type = "standard-3"

[[durable_objects.bindings]]
name = "ORIGIN"
class_name = "Origin"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Origin"]

[[r2_buckets]]
binding = "SITE"
bucket_name = "lebleg-site"
