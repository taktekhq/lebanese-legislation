# The database, API, MCP server and website. Run ./setup, or see README.md.
name: ${COMPOSE_PROJECT_NAME:-lebanese-legislation}
services:
  db:
    image: ${DB_IMAGE:-ghcr.io/taktekhq/lebanese-legislation-db:latest}
    environment:
      POSTGRES_USER: lebleg_owner
      POSTGRES_DB: lebleg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./setup to generate local credentials}
      LEBLEG_READER_PASSWORD: ${READER_PASSWORD:?Run ./setup to generate local credentials}
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "maintenance_work_mem=2GB", "-c", "max_parallel_maintenance_workers=2", "-c", "max_connections=30"]
    shm_size: 3gb
    mem_limit: ${DB_MEMORY:-3g}
    restart: unless-stopped
    volumes: ["db_data:/var/lib/postgresql"]
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    # The test itself comes from the image, so older image tags keep working.
    healthcheck:
      interval: 5s
      start_period: ${DB_START_PERIOD:-2h}
      retries: 30
  # The REST API in api/, read-only on the database. Health comes from the image.
  api:
    image: ${API_IMAGE:-ghcr.io/taktekhq/lebanese-legislation-api:latest}
    environment:
      DATABASE_URL: "host=db dbname=lebleg user=lebleg_reader password=${READER_PASSWORD}"
      # Optional: your own key turns on search by meaning. Exact and citation search need none.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LEBLEG_VECTOR_DSN: ${LEBLEG_VECTOR_DSN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      LEBLEG_VECTORIZE_TOKEN: ${LEBLEG_VECTORIZE_TOKEN:-}
      LEBLEG_VECTORIZE_INDEX: ${LEBLEG_VECTORIZE_INDEX:-}
      GEMINI_MAX_CALLS_PER_DAY: ${GEMINI_MAX_CALLS_PER_DAY:-500}
      GEMINI_CONCURRENCY: ${GEMINI_CONCURRENCY:-2}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    user: "65532:65532"
    mem_limit: 256m
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  # The MCP server in mcp/.
  mcp:
    image: ${MCP_IMAGE:-ghcr.io/taktekhq/lebanese-legislation-mcp:latest}
    environment:
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-}
      DATABASE_URL: "host=db dbname=lebleg user=lebleg_reader password=${READER_PASSWORD}"
      # Optional: your own key turns on search by meaning. Exact and citation search need none.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LEBLEG_VECTOR_DSN: ${LEBLEG_VECTOR_DSN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      LEBLEG_VECTORIZE_TOKEN: ${LEBLEG_VECTORIZE_TOKEN:-}
      LEBLEG_VECTORIZE_INDEX: ${LEBLEG_VECTORIZE_INDEX:-}
      GEMINI_MAX_CALLS_PER_DAY: ${GEMINI_MAX_CALLS_PER_DAY:-500}
      GEMINI_CONCURRENCY: ${GEMINI_CONCURRENCY:-2}
    ports: ["127.0.0.1:${MCP_PORT:-8001}:8080"]
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
    user: "65532:65532"
    mem_limit: 256m
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
  # The all-in-one image serves the website from its own baked database.
  # The whole site from one image: PostgreSQL with the data, the API, MCP and
  # the website server, on http://localhost:8080. It has its own database, so
  # run either this (`docker compose up all`) or the separate db/api/mcp
  # services (`docker compose up db api mcp`), not both. In production the
  # same image runs behind the Cloudflare Worker, which serves static pages
  # from R2 and sends only the API, MCP and search to it.
  all:
    image: ${ALL_IMAGE:-ghcr.io/taktekhq/lebanese-legislation-all:latest}
    profiles: [all]
    ports: ["127.0.0.1:${ALL_PORT:-8080}:8080"]
    environment:
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      LEBLEG_VECTORIZE_TOKEN: ${LEBLEG_VECTORIZE_TOKEN:-}
      LEBLEG_VECTORIZE_INDEX: ${LEBLEG_VECTORIZE_INDEX:-}
    shm_size: 1gb
    restart: unless-stopped

volumes:
  db_data:
