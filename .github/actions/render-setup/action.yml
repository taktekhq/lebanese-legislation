name: render database
description: >-
  Starts PostgreSQL 18.6 with the lebleg database of this commit, adds the rows
  every render adds, and builds /tmp/static-export and /tmp/build-db. The
  database comes from the db image tagged for this commit's data
  (.github/scripts/render-db-tag.sh) when it is published, else from data/ as
  before. The job sets DATABASE_URL.
inputs:
  image:
    description: db image to start instead of the one tagged for this commit (a proof run); "load" loads data/
    default: ""
runs:
  using: composite
  steps:
    - name: Start PostgreSQL 18.6
      id: db
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        # GitHub's runner has psql; act's smaller image does not.
        command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
        docker rm -f pg >/dev/null 2>&1 || true
        fast=(-c fsync=off -c synchronous_commit=off -c full_page_writes=off -c max_wal_size=8GB -c maintenance_work_mem=1GB)
        image=${IMAGE:-ghcr.io/taktekhq/lebanese-legislation-db:$(bash .github/scripts/render-db-tag.sh)}
        baked=false
        # The baked database needs room: the unpacked image (about 8 GB) and
        # the files PostgreSQL rewrites in the container's own layer while
        # pages render. Most runners have 145 GB; some have 72 GB with about
        # 14 GB free, where it filled the disk (run 41845603511). Those first
        # drop the toolchains no render uses, then load data/ if still short.
        need=25
        avail() { df --output=avail -BG / | tail -1 | tr -dc 0-9; }
        if [ "$image" != load ] && [ "$(avail)" -lt "$need" ]; then
          echo "$(avail) GB free: removing unused toolchains"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          if [ "$(avail)" -lt "$need" ]; then
            echo "Database: $(avail) GB free, under $need GB for the db image; loading data/" | tee -a "$GITHUB_STEP_SUMMARY"
            image=load
          fi
        fi
        if [ "$image" != load ] && docker pull -q "$image"; then
          # The baked cluster runs in place (no copy). Its pg_hba trusts
          # 127.0.0.1, which host networking makes this runner.
          docker run -d --name pg --network host -e PGDATA=/opt/lebleg/seed --shm-size=1g "$image" postgres "${fast[@]}"
          baked=true
          echo "Database: $image" | tee -a "$GITHUB_STEP_SUMMARY"
        else
          [ "$image" = load ] || echo "Database: $image is not published; loading data/" | tee -a "$GITHUB_STEP_SUMMARY"
          docker run -d --name pg -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=lebleg -p 127.0.0.1:5432:5432 \
            --shm-size=1g postgres:18.6 "${fast[@]}"
        fi
        for i in $(seq 120); do docker exec pg pg_isready -U postgres -d lebleg -q && break; sleep 1; done
        docker exec pg pg_isready -U postgres -d lebleg
        psql --version
        df -h / | tail -1
        echo "baked=$baked" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: false
    - name: Build static exporter while loading the database
      shell: bash
      env:
        BAKED: ${{ steps.db.outputs.baked }}
      run: |
        ( set +e
          bash -e -o pipefail <<'TASK_EXPORTER' > "$RUNNER_TEMP/exporter.log" 2>&1
        go build -o /tmp/static-export ./cmd/static-export
        go build -o /tmp/build-db ./cmd/build-db
        TASK_EXPORTER
          echo $? > "$RUNNER_TEMP/exporter.status"
        ) &
        ( set +e
          bash -e -o pipefail <<'TASK_LOAD' > "$RUNNER_TEMP/load.log" 2>&1
        if [ "$BAKED" = true ]; then
          echo "the db image holds data/ and official.sql already"
        else
          time data/load.sh "$DATABASE_URL"
          psql "$DATABASE_URL" -f db/official.sql
        fi
        TASK_LOAD
          echo $? > "$RUNNER_TEMP/load.status"
        ) &
        wait
        failed=0
        until [ -f "$RUNNER_TEMP/exporter.status" ]; do sleep 1; done
        cat "$RUNNER_TEMP/exporter.log"
        [ "$(cat "$RUNNER_TEMP/exporter.status")" -eq 0 ] || failed=1
        until [ -f "$RUNNER_TEMP/load.status" ]; do sleep 1; done
        cat "$RUNNER_TEMP/load.log"
        [ "$(cat "$RUNNER_TEMP/load.status")" -eq 0 ] || failed=1
        [ "$failed" -eq 0 ]
    # data/ comes from a nightly built without the popular list, so it holds
    # no english rows: add them here, or every /en/ page stays indexable
    # (issue #86). Only those rows change; page dates stay as data/ has them.
    - name: Hide machine English of unpopular texts
      shell: bash
      run: /tmp/build-db -db "$DATABASE_URL" -only english -popular data/popular_texts.txt
