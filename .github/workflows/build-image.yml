name: build image
on:
  workflow_call:
    inputs:
      image:
        description: 'Image suffix: db, api, mcp, all, vectors'
        required: true
        type: string
      context:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      build_args:
        type: string
        default: ''
      tags:
        required: true
        type: string
      pre_build:
        type: string
        default: ''
      free_disk:
        type: boolean
        default: false
      platforms:
        type: string
        default: linux/amd64
permissions:
  contents: read
  packages: write
jobs:
  build:
    name: image-${{ inputs.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    concurrency:
      group: images-${{ inputs.image }}
      cancel-in-progress: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The caller's own commit. No caller runs on workflow_run, and a
          # triggering run's head is never built here.
          ref: ${{ github.sha }}
      - name: Free runner disk
        if: inputs.free_disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
      - name: Prepare build inputs
        if: inputs.pre_build != ''
        env:
          AWS_DEFAULT_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PRE_BUILD: ${{ inputs.pre_build }}
        run: bash -e -o pipefail -c "$PRE_BUILD"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: tags
        env:
          IMAGE: ${{ inputs.image }}
          TAGS: ${{ inputs.tags }}
        run: |
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<IMAGE_TAGS'
            printf '%s\n' "$TAGS"
            if [ "$IMAGE" != api ] && [ "$IMAGE" != mcp ]; then
              echo "ghcr.io/$GITHUB_REPOSITORY-$IMAGE:$(date -u +%F)"
              if [ "$IMAGE" = all ]; then
                echo "ghcr.io/$GITHUB_REPOSITORY-$IMAGE:$(git rev-parse --short HEAD)"
              fi
              if [ "$IMAGE" = db ]; then # the tag a static-site render looks for
                echo "ghcr.io/$GITHUB_REPOSITORY-$IMAGE:$(bash .github/scripts/render-db-tag.sh)"
              fi
            fi
            echo IMAGE_TAGS
          } >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          build-args: |
            ${{ inputs.build_args }}
            GIT_SHA=${{ github.sha }}
          push: true
          pull: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify both architectures
        if: inputs.image == 'api' || inputs.image == 'mcp'
        env:
          API_IMAGE: ${{ inputs.image == 'api' && format('ghcr.io/{0}-api:source-{1}', github.repository, github.sha) || '' }}
          MCP_IMAGE: ${{ inputs.image == 'mcp' && format('ghcr.io/{0}-mcp:source-{1}', github.repository, github.sha) || '' }}
        run: bash .github/scripts/smoke-images.sh
      - name: Promote verified image
        if: inputs.image == 'api' || inputs.image == 'mcp'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_SERVICE: ${{ inputs.image }}
          DATE_TAG: ${{ steps.tags.outputs.date }}
        run: python3 .github/scripts/promote-image.py
      - name: Image digest
        env:
          IMAGE: ${{ inputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '### Image -%s\n\n`%s`\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
