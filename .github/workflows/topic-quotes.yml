name: topic-quotes
# Checks every topic page against the database: each cited article exists,
# each quote is an exact piece of the wording the article's page prints, and
# each number a page states is in an article it cites (topicgen check).
# Runs when a topic page or the checker changes, and once a day, because a
# night's data can change the wording an existing quote was cut from.
# The database is the published db image: the one tagged for this commit's
# data when it exists, else :latest. No secret is needed, the image is public.
# Quotes known to fail for a reason outside the page are listed, with the
# reason, in cmd/topicgen/known-quotes.tsv.
on:
  pull_request:
    paths:
      - internal/site/topics/**
      - cmd/topicgen/**
      - .github/workflows/topic-quotes.yml
  push:
    branches: [main]
    paths:
      - internal/site/topics/**
      - cmd/topicgen/**
      - .github/workflows/topic-quotes.yml
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:
concurrency:
  group: topic-quotes-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      LEBLEG_DSN: postgresql://postgres:ci@127.0.0.1:5432/lebleg
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/data/*
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start the database from the db image
        run: |
          set -euo pipefail
          # The unpacked image is about 9 GB.
          avail() { df --output=avail -BG / | tail -1 | tr -dc 0-9; }
          if [ "$(avail)" -lt 25 ]; then
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          fi
          repo=ghcr.io/taktekhq/lebanese-legislation-db
          image=$repo:$(bash .github/scripts/render-db-tag.sh)
          docker pull -q "$image" || { image=$repo:latest; docker pull -q "$image"; }
          echo "Database: $image, created $(docker inspect "$image" --format '{{.Created}}')" | tee -a "$GITHUB_STEP_SUMMARY"
          # The baked cluster runs in place; its pg_hba trusts 127.0.0.1,
          # which host networking makes this runner (as render-setup does).
          docker run -d --name pg --network host -e PGDATA=/opt/lebleg/seed --shm-size=1g "$image" postgres
          for i in $(seq 120); do docker exec pg pg_isready -U postgres -d lebleg -q && break; sleep 1; done
          docker exec pg pg_isready -U postgres -d lebleg
      - name: Check every topic page
        run: |
          set -o pipefail
          go run ./cmd/topicgen check | tee check.txt
          { echo '```'; tail -1 check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
