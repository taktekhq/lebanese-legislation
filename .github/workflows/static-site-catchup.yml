name: static-site catch-up
# Starts a static-site deploy when the live site is behind main: the deploy
# for the newest change failed, was cancelled or never started. It runs as
# soon as a deploy on main finishes, and every two hours as a backstop (GitHub
# starts this repository's scheduled runs hours late: on 4 Nov stats ran 8
# hours after its time). It waits while a deploy is queued or running, and
# while the newest data change has not passed the data workflow. A failed
# deploy is run once more, all of it; a second failure turns this check red
# instead. A finished deploy that leaves the site up to date ends here.
on:
  workflow_run:
    workflows: [static-site]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

concurrency:
  group: static-site-catchup
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  check:
    # Woken only by static-site runs of this repository. static-site has no
    # pull request trigger, so its runs come from push, workflow_run, schedule
    # or workflow_dispatch; a pull request run is refused all the same.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event != 'pull_request' &&
        github.event.workflow_run.event != 'pull_request_target')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: .github
      - name: Compare the live site with main
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_DEFAULT_REGION: auto
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          say() { echo "$*" | tee -a "$GITHUB_STEP_SUMMARY"; }
          head=$(git rev-parse HEAD)
          rendered=""
          if aws s3api get-object --bucket lebleg-site --key _export/rendered-commit \
              --endpoint-url https://5f012a200d9622ea6aecef1a02693e26.r2.cloudflarestorage.com \
              rendered-commit >/dev/null 2>read-error; then
            rendered=$(cat rendered-commit)
          elif ! grep -Eq 'NoSuchKey|\(404\)' read-error; then
            cat read-error >&2
            exit 1
          fi
          if [ "$rendered" = "$head" ]; then
            say "Up to date: the live site was rendered from $head."
            exit 0
          fi

          busy=$(gh run list -w static-site.yml -L 20 --json status --jq '[.[] | select(.status != "completed")] | length')
          if [ "$busy" -gt 0 ]; then
            say "A deploy is queued or running; the next check looks again."
            exit 0
          fi

          # The newest data change must have passed the data workflow first.
          if [ -n "$rendered" ] && git cat-file -e "$rendered^{commit}" 2>/dev/null; then
            data=$(git log -1 --format=%H "$rendered..$head" -- data/)
          else
            data=$(git log -1 --format=%H "$head" -- data/)
          fi
          if [ -n "$data" ]; then
            # Passed means the data workflow's build job (its checks) succeeded on
            # this commit or a later one. Its image jobs can be cancelled by a
            # newer push building the same image (4 Nov: #146's data run ended
            # "cancelled" in image-all and this check waited for good).
            checked=false
            for run in $(gh run list -w data.yml -b main -L 30 --json databaseId,headSha,status \
                --jq '.[] | select(.status == "completed") | "\(.databaseId):\(.headSha)"'); do
              git merge-base --is-ancestor "$data" "${run#*:}" 2>/dev/null || continue
              build=$(gh run view "${run%%:*}" --json jobs --jq '[.jobs[] | select(.name == "build") | .conclusion][0]')
              if [ "$build" = success ]; then checked=true; break; fi
            done
            if [ "$checked" = false ]; then
              say "Data commit $data has not passed the data workflow yet; waiting."
              exit 0
            fi
          fi

          read -r id conclusion attempt < <(gh run list -w static-site.yml -L 1 \
            --json databaseId,conclusion,attempt --jq '.[0] | "\(.databaseId) \(.conclusion) \(.attempt)"')
          if [ "$conclusion" = failure ]; then
            if [ "$attempt" -lt 2 ]; then
              # The whole run, not --failed: a full render's shards exchange
              # crawl paths under a prefix keyed by run attempt, so one shard
              # rerun alone waits 30 minutes for partners that never come and
              # fails (run 41936815634, 5 Nov). Unchanged pages upload nothing.
              gh run rerun "$id"
              say "Deploy run $id failed; running it again."
              exit 0
            fi
            say "Deploy run $id failed twice; not retrying. Read its log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/$id"
            exit 1
          fi

          gh workflow run static-site.yml -r main -f commit="$head"
          say "Started a deploy of $head (the live site was rendered from ${rendered:-nothing yet})."
