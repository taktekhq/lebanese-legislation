name: origin
'on':
  workflow_run:
    workflows: [checks, data]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      route:
        description: Optional comma-separated Worker routes
        type: string
        default: ''
      image:
        description: Deploy an already pushed Cloudflare image tagged with its full build commit
        type: string
        default: ''
      tag:
        description: Published lebanese-legislation-all tag
        type: string
        default: latest
      deploy_site_worker:
        description: Deploy the site Worker before staging (routes apply only here)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: origin
  cancel-in-progress: false
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 5f012a200d9622ea6aecef1a02693e26
  AWS_DEFAULT_REGION: auto
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: https://5f012a200d9622ea6aecef1a02693e26.r2.cloudflarestorage.com
  ORIGIN_TEST_KEY: ${{ secrets.ORIGIN_TEST_KEY }}
  ROUTES: ${{ inputs.route }}
jobs:
  eligible:
    # A checks or data run deploys only when it was a push (or a manual run) on this
    # repository's main. Every later job needs eligible's output.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
    - uses: actions/github-script@v7
      id: check
      with:
        script: |
          if (context.eventName === 'workflow_dispatch') {
            core.setOutput('deploy', 'true');
            return;
          }
          // A commit that also changes data/ needs the database the data
          // build makes (new tables, views, columns). When checks finish
          // first, deploying now stages code against the old database: its
          // warm-up 500s until the data run's own deploy replaces it (7 Nov,
          // PR #176: 24 minutes of errors and an alert). Leave the commit to
          // the deploy that the data run starts when it finishes.
          const run = context.payload.workflow_run;
          if (run.name === 'checks') {
            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'data.yml',
              head_sha: run.head_sha,
              per_page: 20,
            });
            const pending = data.workflow_runs.filter(r => r.status !== 'completed');
            if (pending.length) {
              core.notice(`data run ${pending[0].id} for ${run.head_sha} is ${pending[0].status}; its completion deploys this commit`);
              core.setOutput('deploy', 'false');
              return;
            }
          }
          const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
            ...context.repo,
            run_id: context.payload.workflow_run.id,
            filter: 'latest',
            per_page: 100,
          });
          core.setOutput('deploy', jobs.some(job =>
            job.name === 'all / image-all' && job.conclusion === 'success'));
  image:
    needs: eligible
    if: needs.eligible.outputs.deploy == 'true' && inputs.image == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      image: ${{ steps.image.outputs.image }}
      build: ${{ steps.image.outputs.build }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install dependencies
      working-directory: workers/static-site
      run: npm ci
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Free disk
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        docker system prune -af
    - name: Copy published all-in-one image to Cloudflare
      id: image
      env:
        IMAGE_TAG: ${{ inputs.tag || 'latest' }}
      run: |
        docker pull "ghcr.io/taktekhq/lebanese-legislation-all:$IMAGE_TAG"
        revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "ghcr.io/taktekhq/lebanese-legislation-all:$IMAGE_TAG")
        export REVISION="$revision"
        build=$(python3 - <<'PYBUILD'
        import os, runpy
        deploy = runpy.run_path('workers/static-site/scripts/origin-deploy.py')
        revision = os.environ['REVISION']
        if revision == '<no value>':
            revision = ''
        print(deploy['image_build']('ghcr.io/taktekhq/lebanese-legislation-all:' + os.environ['IMAGE_TAG'], revision))
        PYBUILD
        )
        tag="lebleg-static-site-origin:${build}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        docker tag "ghcr.io/taktekhq/lebanese-legislation-all:$IMAGE_TAG" "$tag"
        (cd workers/static-site && npx --yes wrangler@4.151.1 containers push "$tag")
        echo "image=registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/$tag" >> "$GITHUB_OUTPUT"
        echo "build=$build" >> "$GITHUB_OUTPUT"
  site-worker:
    needs:
    - image
    if: ${{ always() && inputs.deploy_site_worker && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install dependencies
      working-directory: workers/static-site
      run: npm ci
    - name: Deploy site Worker
      run: python3 workers/static-site/scripts/origin-deploy.py site-worker
  stage:
    needs:
    - eligible
    - image
    - site-worker
    if: ${{ always() && needs.eligible.outputs.deploy == 'true' && (needs.image.result == 'success' || needs.image.result == 'skipped') && (needs.site-worker.result == 'success' || needs.site-worker.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install dependencies
      working-directory: workers/origin
      run: npm ci
    - name: Stage idle side
      id: stage
      env:
        IMAGE: ${{ inputs.image || needs.image.outputs.image }}
        EXPECTED_BUILD: ${{ inputs.image == '' && needs.image.outputs.build || '' }}
        GEMINI_API_KEY: ${{ secrets.LEBLEG_GEMINI_API_KEY }}
        LEBLEG_VECTORIZE_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
      run: python3 workers/static-site/scripts/origin-deploy.py stage
    - uses: actions/upload-artifact@v4
      with:
        name: origin-state
        path: origin-state.json
        retention-days: 3
  warm:
    needs:
    - stage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: origin-state
        path: .
    - name: Warm origin
      run: python3 workers/static-site/scripts/origin-deploy.py warm
    if: ${{ !cancelled() && needs.stage.result == 'success' }}
  switch:
    needs:
    - stage
    - warm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: origin-state
        path: .
    - name: Switch origin
      run: python3 workers/static-site/scripts/origin-deploy.py switch
    if: ${{ !cancelled() && needs.stage.result == 'success' && needs.warm.result == 'success' }}
  verify:
    needs:
    - stage
    - switch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: origin-state
        path: .
    - name: Verify origin
      run: python3 workers/static-site/scripts/origin-deploy.py verify
    if: ${{ !cancelled() && needs.stage.result == 'success' && needs.switch.result == 'success' }}
  rollback:
    needs:
    - stage
    - switch
    - verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: origin-state
        path: .
    - name: Rollback origin
      run: python3 workers/static-site/scripts/origin-deploy.py rollback
    if: ${{ always() && needs.stage.result == 'success' && needs.switch.result == 'success' && needs.verify.result == 'failure' }}
  retire:
    needs:
    - stage
    - verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: origin-state
        path: .
    - name: Retire origin
      run: python3 workers/static-site/scripts/origin-deploy.py retire
    if: ${{ !cancelled() && needs.stage.result == 'success' && needs.verify.result == 'success' }}
