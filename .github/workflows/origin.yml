name: origin
'on':
  workflow_dispatch:
    inputs:
      route:
        description: Optional comma-separated Worker routes
        type: string
        default: ''
      image:
        description: Deploy this already pushed Cloudflare registry image instead of building
        type: string
        default: ''
      data_tag:
        description: Data image date tag
        type: string
        default: latest
      deploy_site_worker:
        description: Deploy the site Worker before staging (routes and mode apply only here)
        type: boolean
        default: false
      mode:
        description: Origin mode
        type: choice
        options:
        - hetzner
        - container
        default: hetzner
permissions:
  contents: read
  packages: read
concurrency:
  group: origin
  cancel-in-progress: false
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: 5f012a200d9622ea6aecef1a02693e26
  AWS_DEFAULT_REGION: auto
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  R2_ENDPOINT: https://5f012a200d9622ea6aecef1a02693e26.r2.cloudflarestorage.com
  ORIGIN_TEST_KEY: ${{ secrets.ORIGIN_TEST_KEY }}
  MODE: ${{ inputs.mode }}
  ROUTES: ${{ inputs.route }}
jobs:
  image:
    if: inputs.image == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install dependencies
      working-directory: workers/static-site
      run: npm ci
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Free disk
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        docker system prune -af
    - name: Prepare code build context
      run: |
        build=workers/static-site/container/build
        mkdir -p "$build/src/web"
        cp go.mod go.sum THIRD_PARTY_NOTICES.txt "$build/src/"
        cp -R internal "$build/src/internal"
        cp web/main.go "$build/src/web/"
    - name: Build and push site image
      id: image
      env:
        DATA_TAG: ${{ inputs.data_tag }}
      run: |
        tag="lebleg-static-site-origin:${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
        docker build --build-arg DATA_TAG="$DATA_TAG" -t "$tag" workers/static-site/container
        (cd workers/static-site && npx --yes wrangler@4.151.1 containers push "$tag")
        echo "image=registry.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/$tag" >> "$GITHUB_OUTPUT"
  site-worker:
    needs:
    - image
    if: ${{ always() && inputs.deploy_site_worker && (needs.image.result == 'success' || needs.image.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install dependencies
      working-directory: workers/static-site
      run: npm ci
    - name: Deploy site Worker
      run: python3 workers/static-site/scripts/origin-deploy.py site-worker
  stage:
    needs:
    - image
    - site-worker
    if: ${{ always() && (needs.image.result == 'success' || needs.image.result == 'skipped') && (needs.site-worker.result == 'success' || needs.site-worker.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install dependencies
      working-directory: workers/origin
      run: npm ci
    - name: Stage idle side
      id: stage
      env:
        IMAGE: ${{ inputs.image || needs.image.outputs.image }}
        GEMINI_API_KEY: ${{ secrets.LEBLEG_GEMINI_API_KEY }}
        LEBLEG_VECTORIZE_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
      run: python3 workers/static-site/scripts/origin-deploy.py stage
    - uses: actions/upload-artifact@v4
      with:
        name: origin-state
        path: origin-state.json
        retention-days: 3
  warm:
    needs:
    - stage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: origin-state
        path: .
    - name: Warm origin
      run: python3 workers/static-site/scripts/origin-deploy.py warm
    if: ${{ !cancelled() && needs.stage.result == 'success' }}
  switch:
    needs:
    - stage
    - warm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: origin-state
        path: .
    - name: Switch origin
      run: python3 workers/static-site/scripts/origin-deploy.py switch
    if: ${{ !cancelled() && needs.stage.result == 'success' && needs.warm.result == 'success' }}
  verify:
    needs:
    - stage
    - switch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: origin-state
        path: .
    - name: Verify origin
      run: python3 workers/static-site/scripts/origin-deploy.py verify
    if: ${{ !cancelled() && needs.stage.result == 'success' && needs.switch.result == 'success' }}
  rollback:
    needs:
    - stage
    - switch
    - verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: origin-state
        path: .
    - name: Rollback origin
      run: python3 workers/static-site/scripts/origin-deploy.py rollback
    if: ${{ always() && needs.stage.result == 'success' && needs.switch.result == 'success' && needs.verify.result == 'failure' }}
  retire:
    needs:
    - stage
    - verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/download-artifact@v4
      with:
        name: origin-state
        path: .
    - name: Retire origin
      run: python3 workers/static-site/scripts/origin-deploy.py retire
    if: ${{ !cancelled() && needs.stage.result == 'success' && needs.verify.result == 'success' }}
