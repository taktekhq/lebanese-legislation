name: vectors
on:
  workflow_dispatch:
    inputs:
      only_vectorize:
        description: Filter the public vectors to current data and sync without publishing to Hugging Face
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['vectors/**', 'cmd/vectorize-sync/**', 'cmd/export-vectors/**', 'internal/vectorize/**', 'data/**', 'internal/semantic/**', '.github/workflows/vectors.yml']
permissions:
  contents: read
  packages: read
concurrency:
  group: vectors
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --shm-size=2g --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate current chunk IDs from data
        run: |
          createdb lebleg
          createdb lebleg_search
          sh data/load.sh 'host=localhost user=postgres dbname=lebleg'
          psql -v ON_ERROR_STOP=1 -d lebleg -f db/official.sql -f tools/src/lebleg/sql/web.sql
          go run ./cmd/build-search -corpus-dsn 'host=localhost user=postgres dbname=lebleg' -index-dsn 'host=localhost user=postgres dbname=lebleg_search' -ids-out "$RUNNER_TEMP/current.csv"
      - name: Download public vectors
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/published.parquet" \
            https://huggingface.co/datasets/taktekhq/lebanese-legislation/resolve/main/vectors/vectors.parquet
      - name: Filter to current IDs, refusing missing embeddings
        env:
          IMAGE: ghcr.io/taktekhq/lebanese-legislation-vectors:latest
        run: |
          mkdir -p "$RUNNER_TEMP/out/vectors"
          docker run --rm --entrypoint duckdb -v "$RUNNER_TEMP:/work" "$IMAGE" -batch -bail -c "
            SET memory_limit='8GB'; SET threads=2; SET preserve_insertion_order=false; SET temp_directory='/work/duckdb-tmp';
            CREATE VIEW current AS SELECT * FROM read_csv('/work/current.csv', all_varchar=true);
            CREATE VIEW published AS SELECT * FROM read_parquet('/work/published.parquet');
            SELECT CASE WHEN count(*)=0 THEN true ELSE error('Current chunks lack published vectors; run the release workflow to embed them first') END
              FROM current c ANTI JOIN published p ON c.id=p.id AND c.hash=p.hash;
            COPY (SELECT p.* FROM published p JOIN current c ON c.id=p.id AND c.hash=p.hash)
              TO '/work/out/vectors/vectors.parquet' (FORMAT parquet, COMPRESSION zstd);
            COPY (SELECT id,hash FROM published) TO '/work/out/vectors/archive-manifest.tsv' (FORMAT CSV, DELIMITER '\t', HEADER false, QUOTE '');"
      - uses: actions/upload-artifact@v4
        with:
          name: vectors-parquet
          path: ${{ runner.temp }}/out/vectors/
          retention-days: 3
          compression-level: 0
  publish:
    # Keep the archive deletion baseline public until sync and its manifest succeed.
    needs: [build, vectorize]
    if: ${{ !inputs.only_vectorize }}
    runs-on: ubuntu-24.04
    # HF_TOKEN lives only in the huggingface environment, which deploys from main
    # only; on other branches it runs without it and uploads nothing.
    environment: ${{ github.ref == 'refs/heads/main' && 'huggingface' || '' }}
    timeout-minutes: 300
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: taktekhq/lebanese-legislation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vectors-parquet
          path: ${{ runner.temp }}/out/vectors
      - name: Remove sync baseline from publication
        run: rm -f "$RUNNER_TEMP/out/vectors/archive-manifest.tsv"
      - name: Upload to Hugging Face
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo 'No HF_TOKEN secret: vectors.parquet not uploaded.' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 -m venv "$RUNNER_TEMP/venv"
            . "$RUNNER_TEMP/venv/bin/activate"
            pip install --quiet "huggingface_hub==1.33.0"
            hf upload "$HF_REPO" "$RUNNER_TEMP/out" . --repo-type dataset \
              --commit-message "Vectors from $(git rev-parse --short=12 HEAD), $(date -u +%F)"
          fi
  vectorize:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      AWS_DEFAULT_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: https://5f012a200d9622ea6aecef1a02693e26.r2.cloudflarestorage.com
      CLOUDFLARE_ACCOUNT_ID: 5f012a200d9622ea6aecef1a02693e26
      LEBLEG_VECTORIZE_INDEX: lebleg-chunks
      LEBLEG_VECTORIZE_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vectors-parquet
          path: ${{ runner.temp }}/out/vectors
      - name: Download previous manifest
        run: |
          if ! aws s3 cp s3://lebleg-site/_build/vectors-manifest.tsv "$RUNNER_TEMP/previous.tsv" \
              --endpoint-url "$R2_ENDPOINT" 2> "$RUNNER_TEMP/manifest-download.log"; then
            if grep -Eq '\(404\)|NoSuchKey|Not Found' "$RUNNER_TEMP/manifest-download.log"; then
              rm -f "$RUNNER_TEMP/previous.tsv"
            else
              cat "$RUNNER_TEMP/manifest-download.log" >&2
              exit 1
            fi
          fi
      - name: Include stale archive IDs in the deletion baseline
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          rows = {}
          for path in (root/'out/vectors/archive-manifest.tsv', root/'previous.tsv'):
              if path.exists():
                  for line in path.read_text().splitlines():
                      key, value = line.split('\t')
                      rows[key] = value
          (root/'previous.tsv').write_text(''.join(f'{k}\t{v}\n' for k,v in rows.items()))
          PYCODE
      - name: Sync Vectorize using the vectors image
        env:
          IMAGE: ghcr.io/taktekhq/lebanese-legislation-vectors:latest
        run: |
          docker run --rm -v "$RUNNER_TEMP:/work" \
            -e CLOUDFLARE_ACCOUNT_ID -e LEBLEG_VECTORIZE_TOKEN -e LEBLEG_VECTORIZE_INDEX \
            -e VECTORS_INPUT=/work/out/vectors/vectors.parquet -e VECTORS_PREVIOUS=/work/previous.tsv \
            "$IMAGE"
          aws s3 cp "$RUNNER_TEMP/vectors-manifest.tsv" s3://lebleg-site/_build/vectors-manifest.tsv --endpoint-url "$R2_ENDPOINT"
