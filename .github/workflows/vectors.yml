name: vectors

on:
  workflow_dispatch:

permissions:
  contents: read

# A manifest must describe the last completed sync, so never overlap runs.
concurrency:
  group: vectors
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      AWS_DEFAULT_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: https://5f012a200d9622ea6aecef1a02693e26.r2.cloudflarestorage.com
      CLOUDFLARE_ACCOUNT_ID: 5f012a200d9622ea6aecef1a02693e26
      LEBLEG_VECTORIZE_INDEX: lebleg-chunks
      LEBLEG_VECTORIZE_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
      LEBLEG_VECTOR_DSN: postgresql://postgres:ci@127.0.0.1:5432/lebleg_search
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: taktekhq/lebanese-legislation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
      - name: Download vector database in the background
        run: |
          ( set +e
            bash -e -o pipefail <<'TASK_VECTOR-DUMP' > "$RUNNER_TEMP/vector-dump.log" 2>&1
          aws s3 cp s3://lebleg-site/_build/lebleg_search.dump "$RUNNER_TEMP/lebleg_search.dump" --endpoint-url "$R2_ENDPOINT"
          TASK_VECTOR-DUMP
            echo $? > "$RUNNER_TEMP/vector-dump.status"
          ) &
      - name: Build PostgreSQL 18.6 with pgvector 0.8.2
        run: docker build --target postgres -f db/Dockerfile -t vectors-db .
      - name: Start DuckDB installation
        run: |
          ( set +e
            bash -e -o pipefail <<'TASK_DUCKDB' > "$RUNNER_TEMP/duckdb.log" 2>&1
          curl -fsSL -o "$RUNNER_TEMP/duckdb.zip" https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q "$RUNNER_TEMP/duckdb.zip" -d "$RUNNER_TEMP/bin"
          TASK_DUCKDB
            echo $? > "$RUNNER_TEMP/duckdb.status"
          ) &
      - name: Wait for vector database dump
        run: |
          failed=0
          until [ -f "$RUNNER_TEMP/vector-dump.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/vector-dump.log"
          [ "$(cat "$RUNNER_TEMP/vector-dump.status")" -eq 0 ] || failed=1
          [ "$failed" -eq 0 ]
      - name: Restore vector database
        run: |
          docker run -d --name vectors-db -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=lebleg_search \
            -p 127.0.0.1:5432:5432 --shm-size=1g \
            -v "$RUNNER_TEMP/lebleg_search.dump:/dump/lebleg_search.dump:ro" \
            vectors-db -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
            -c max_wal_size=8GB -c maintenance_work_mem=1GB
          ready=0
          for i in $(seq 60); do
            if docker exec vectors-db pg_isready -U postgres -d lebleg_search -q; then ready=1; break; fi
            sleep 1
          done
          [ "$ready" = 1 ] || { docker logs vectors-db; exit 1; }
          # Data only, no indexes: the export reads the table once in order.
          docker exec vectors-db pg_restore -U postgres --no-owner --no-privileges -j 4 \
            --section=pre-data --section=data -d lebleg_search /dump/lebleg_search.dump
      - name: Export vectors
        run: go run ./cmd/export-vectors -out "$RUNNER_TEMP/vectors.ndjson"
      - name: Wait for DuckDB
        run: |
          failed=0
          until [ -f "$RUNNER_TEMP/duckdb.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/duckdb.log"
          [ "$(cat "$RUNNER_TEMP/duckdb.status")" -eq 0 ] || failed=1
          [ "$failed" -eq 0 ]
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Parquet and Hugging Face, in the background
        run: |
          cat > "$RUNNER_TEMP/hf.sh" <<'HF'
          set -eu
          mkdir -p "$RUNNER_TEMP/out/vectors"
          duckdb -c "SET memory_limit='2GB'; SET temp_directory='$RUNNER_TEMP/duckdb-tmp';
            COPY (SELECT id, document, model, hash, values::FLOAT[768] AS values
              FROM read_json('$RUNNER_TEMP/vectors.ndjson', format='newline_delimited',
                columns={id: 'VARCHAR', document: 'VARCHAR', model: 'VARCHAR', hash: 'VARCHAR', values: 'FLOAT[768]'}))
            TO '$RUNNER_TEMP/out/vectors/vectors.parquet' (FORMAT parquet, COMPRESSION zstd);"
          if [ -z "$HF_TOKEN" ]; then
            echo 'No HF_TOKEN secret: vectors.parquet not uploaded.' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 -m venv "$RUNNER_TEMP/venv"
            . "$RUNNER_TEMP/venv/bin/activate"
            pip install --quiet "huggingface_hub==1.33.0"
            hf upload "$HF_REPO" "$RUNNER_TEMP/out" . --repo-type dataset \
              --commit-message "Vectors from $(git rev-parse --short=12 HEAD), $(date -u +%F)"
          fi
          HF
          ( bash "$RUNNER_TEMP/hf.sh" > "$RUNNER_TEMP/hf.log" 2>&1; echo $? > "$RUNNER_TEMP/hf.status" ) &
      - name: Download previous manifest
        run: |
          if ! aws s3 cp s3://lebleg-site/_build/vectors-manifest.tsv "$RUNNER_TEMP/previous.tsv" \
              --endpoint-url "$R2_ENDPOINT" 2> "$RUNNER_TEMP/manifest-download.log"; then
            if grep -Eq '\(404\)|NoSuchKey|Not Found' "$RUNNER_TEMP/manifest-download.log"; then
              rm -f "$RUNNER_TEMP/previous.tsv"
              echo 'No previous manifest: first sync.'
            else
              cat "$RUNNER_TEMP/manifest-download.log" >&2
              exit 1
            fi
          fi
      - name: Sync Vectorize
        run: |
          go run ./cmd/vectorize-sync -in "$RUNNER_TEMP/vectors.ndjson" \
            -prev "$RUNNER_TEMP/previous.tsv" -manifest "$RUNNER_TEMP/vectors-manifest.tsv"
          aws s3 cp "$RUNNER_TEMP/vectors-manifest.tsv" s3://lebleg-site/_build/vectors-manifest.tsv --endpoint-url "$R2_ENDPOINT"
      - name: Wait for Parquet and Hugging Face
        if: always()
        run: |
          until [ -f "$RUNNER_TEMP/hf.status" ]; do sleep 10; done
          cat "$RUNNER_TEMP/hf.log"
          exit "$(cat "$RUNNER_TEMP/hf.status")"
      - name: Clean up database
        if: always()
        run: docker rm -f vectors-db >/dev/null 2>&1 || true
