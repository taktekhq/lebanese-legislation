name: vectors
on:
  workflow_dispatch:
    inputs:
      only_vectorize:
        description: Filter the public vectors to current data and sync without publishing to Hugging Face
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['vectors/**', 'cmd/vectorize-sync/**', 'cmd/export-vectors/**', 'cmd/embed-missing/**', 'internal/embedding/**', 'internal/vectorize/**', 'data/**', 'internal/semantic/**', '.github/workflows/vectors.yml']
permissions:
  contents: read
  packages: read
  actions: read # publish asks whether this commit's data run has published
jobs:
  build:
    concurrency:
      group: vectors-build-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:18.6-trixie
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --shm-size=2g --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Generate current chunk IDs from data
        run: |
          createdb lebleg
          createdb lebleg_search
          sh data/load.sh 'host=localhost user=postgres dbname=lebleg'
          psql -v ON_ERROR_STOP=1 -d lebleg -f db/official.sql -f tools/src/lebleg/sql/web.sql
          go run ./cmd/build-search -corpus-dsn 'host=localhost user=postgres dbname=lebleg' -index-dsn 'host=localhost user=postgres dbname=lebleg_search' -ids-out "$RUNNER_TEMP/current.csv"
      - name: Download public vectors
        run: |
          curl -fL --retry 3 -o "$RUNNER_TEMP/published.parquet" \
            https://huggingface.co/datasets/taktekhq/lebanese-legislation/resolve/main/vectors/vectors.parquet
      - name: Name the budget day
        id: budget-day
        run: echo "day=$(TZ=Asia/Beirut date +%F)" >> "$GITHUB_OUTPUT"
      - name: Keep the daily embedding budget between runs
        id: budget
        uses: actions/cache/restore@v4
        with:
          path: |
            .release/budget
            .release/pending.ndjson
          key: embedding-budget-${{ steps.budget-day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            embedding-budget-${{ steps.budget-day.outputs.day }}-
            embedding-budget-
      - name: Find missing embeddings
        env:
          IMAGE: ghcr.io/taktekhq/lebanese-legislation-vectors:latest
        run: |
          mkdir -p .release/budget
          touch .release/pending.ndjson
          cp .release/pending.ndjson "$RUNNER_TEMP/pending.ndjson"
          docker run --rm --entrypoint duckdb -v "$RUNNER_TEMP:/work" "$IMAGE" -batch -bail -c "
            SET memory_limit='8GB'; SET threads=2; SET temp_directory='/work/duckdb-tmp';
            CREATE VIEW current AS SELECT * FROM read_csv('/work/current.csv', all_varchar=true);
            CREATE VIEW published AS SELECT * FROM read_parquet('/work/published.parquet');
            CREATE TABLE pending AS SELECT * FROM read_json('/work/pending.ndjson', format='newline_delimited',
              columns={id: 'VARCHAR', document: 'VARCHAR', model: 'VARCHAR', hash: 'VARCHAR', values: 'FLOAT[768]'});
            CREATE VIEW available AS SELECT * FROM published UNION ALL SELECT * FROM pending;
            COPY (SELECT c.id,c.hash FROM current c ANTI JOIN available p ON c.id=p.id AND c.hash=p.hash ORDER BY c.id)
              TO '/work/missing.csv' (FORMAT CSV, HEADER);
            COPY (SELECT p.* FROM pending p JOIN current c ON c.id=p.id AND c.hash=p.hash
              ANTI JOIN published a ON p.id=a.id AND p.hash=a.hash)
              TO '/work/pending-current.ndjson' (FORMAT JSON);"
          cp "$RUNNER_TEMP/pending-current.ndjson" .release/pending.ndjson
      - name: Embed missing chunks under the daily budget
        id: embed
        env:
          GEMINI_API_KEY: ${{ secrets.LEBLEG_GEMINI_API_KEY }}
        run: |
          if [ "$(wc -l < "$RUNNER_TEMP/missing.csv")" -gt 1 ]; then
            # go run reports a program's exit 2 as exit 1 with "exit status 2".
            status=0
            go run ./cmd/embed-missing \
              -index-dsn 'host=localhost user=postgres dbname=lebleg_search' \
              -missing "$RUNNER_TEMP/missing.csv" -out "$RUNNER_TEMP/new.ndjson" \
              -daily-budget-dir .release/budget \
              2> "$RUNNER_TEMP/embed.log" || status=$?
            cat "$RUNNER_TEMP/embed.log" >&2
            if [ -f "$RUNNER_TEMP/new.ndjson" ]; then
              cat "$RUNNER_TEMP/new.ndjson" >> .release/pending.ndjson
            fi
            if [ "$status" -ne 0 ] && ! grep -qx 'exit status 2' "$RUNNER_TEMP/embed.log"; then
              exit "$status"
            fi
          else
            echo 'embedded=0'
          fi
      - name: Save the budget and completed rows even when incomplete
        if: ${{ always() && steps.embed.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .release/budget
            .release/pending.ndjson
          key: ${{ steps.budget.outputs.cache-primary-key }}
      - name: Filter to current IDs and check embedding coverage
        env:
          IMAGE: ghcr.io/taktekhq/lebanese-legislation-vectors:latest
        run: |
          mkdir -p "$RUNNER_TEMP/out/vectors"
          cp .release/pending.ndjson "$RUNNER_TEMP/new.ndjson"
          docker run --rm --entrypoint duckdb -v "$RUNNER_TEMP:/work" "$IMAGE" -batch -bail -c "
            SET memory_limit='8GB'; SET threads=2; SET preserve_insertion_order=false; SET temp_directory='/work/duckdb-tmp';
            CREATE VIEW current AS SELECT * FROM read_csv('/work/current.csv', all_varchar=true);
            CREATE VIEW published AS SELECT * FROM read_parquet('/work/published.parquet');
            CREATE VIEW new_vectors AS SELECT id,document,model,hash,values::FLOAT[768] AS values
              FROM read_json('/work/new.ndjson', format='newline_delimited',
                columns={id: 'VARCHAR', document: 'VARCHAR', model: 'VARCHAR', hash: 'VARCHAR', values: 'FLOAT[768]'});
            CREATE VIEW available AS SELECT * FROM published UNION ALL SELECT * FROM new_vectors;
            SELECT CASE WHEN count(*)=0 THEN true ELSE error(count(*)::VARCHAR || ' current chunks still lack vectors (daily embedding budget); they will be embedded on the next run') END
              FROM current c ANTI JOIN available p ON c.id=p.id AND c.hash=p.hash;
            COPY (SELECT p.* FROM available p JOIN current c ON c.id=p.id AND c.hash=p.hash)
              TO '/work/out/vectors/vectors.parquet' (FORMAT parquet, COMPRESSION zstd);
            COPY (SELECT id,hash FROM published) TO '/work/out/vectors/archive-manifest.tsv' (FORMAT CSV, DELIMITER '\t', HEADER false, QUOTE '');"
      - uses: actions/upload-artifact@v4
        with:
          name: vectors-parquet
          path: ${{ runner.temp }}/out/vectors/
          retention-days: 3
          compression-level: 0
  publish:
    concurrency:
      group: vectors-publish-${{ github.ref }}
      cancel-in-progress: false
    # Keep the archive deletion baseline public until sync and its manifest succeed.
    needs: [build, vectorize]
    if: ${{ !inputs.only_vectorize }}
    runs-on: ubuntu-24.04
    # HF_TOKEN lives only in the huggingface environment, which deploys from main
    # only; on other branches it runs without it and uploads nothing.
    environment: ${{ github.ref == 'refs/heads/main' && 'huggingface' || '' }}
    timeout-minutes: 300
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: taktekhq/lebanese-legislation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vectors-parquet
          path: ${{ runner.temp }}/out/vectors
      - name: Remove sync baseline from publication
        run: rm -f "$RUNNER_TEMP/out/vectors/archive-manifest.tsv"
      - name: Let a data publish of this commit carry the vectors
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/hf-wait-for-data.sh
      - name: Upload to Hugging Face
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo 'No HF_TOKEN secret: vectors.parquet not uploaded.' | tee -a "$GITHUB_STEP_SUMMARY"
          else
            python3 -m venv "$RUNNER_TEMP/venv"
            . "$RUNNER_TEMP/venv/bin/activate"
            pip install --quiet "huggingface_hub==1.33.0"
            hf upload "$HF_REPO" "$RUNNER_TEMP/out" . --repo-type dataset \
              --commit-message "Vectors from $(git rev-parse --short=12 HEAD), $(date -u +%F)"
          fi
  vectorize:
    concurrency:
      group: vectors-vectorize-${{ github.ref }}
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      AWS_DEFAULT_REGION: auto
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: https://5f012a200d9622ea6aecef1a02693e26.r2.cloudflarestorage.com
      CLOUDFLARE_ACCOUNT_ID: 5f012a200d9622ea6aecef1a02693e26
      LEBLEG_VECTORIZE_INDEX: lebleg-chunks
      LEBLEG_VECTORIZE_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vectors-parquet
          path: ${{ runner.temp }}/out/vectors
      - name: Download previous manifest
        run: |
          if ! aws s3 cp s3://lebleg-site/_build/vectors-manifest.tsv "$RUNNER_TEMP/previous.tsv" \
              --endpoint-url "$R2_ENDPOINT" 2> "$RUNNER_TEMP/manifest-download.log"; then
            if grep -Eq '\(404\)|NoSuchKey|Not Found' "$RUNNER_TEMP/manifest-download.log"; then
              rm -f "$RUNNER_TEMP/previous.tsv"
            else
              cat "$RUNNER_TEMP/manifest-download.log" >&2
              exit 1
            fi
          fi
      - name: Include stale archive IDs in the deletion baseline
        run: |
          python3 - <<'PYCODE'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          rows = {}
          for path in (root/'out/vectors/archive-manifest.tsv', root/'previous.tsv'):
              if path.exists():
                  for line in path.read_text().splitlines():
                      key, value = line.split('\t')
                      rows[key] = value
          (root/'previous.tsv').write_text(''.join(f'{k}\t{v}\n' for k,v in rows.items()))
          PYCODE
      - name: Sync Vectorize using the vectors image
        env:
          IMAGE: ghcr.io/taktekhq/lebanese-legislation-vectors:latest
        run: |
          docker run --rm -v "$RUNNER_TEMP:/work" \
            -e CLOUDFLARE_ACCOUNT_ID -e LEBLEG_VECTORIZE_TOKEN -e LEBLEG_VECTORIZE_INDEX \
            -e VECTORS_INPUT=/work/out/vectors/vectors.parquet -e VECTORS_PREVIOUS=/work/previous.tsv \
            "$IMAGE"
          # Images built before c22f2cf write the manifest 0600 as root; this job runs
          # the previous :latest, which is rebuilt only after a successful sync.
          sudo chmod a+r "$RUNNER_TEMP/vectors-manifest.tsv"
          aws s3 cp "$RUNNER_TEMP/vectors-manifest.tsv" s3://lebleg-site/_build/vectors-manifest.tsv --endpoint-url "$R2_ENDPOINT"
  vectors:
    needs: publish
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image: vectors
      context: .
      dockerfile: vectors/Dockerfile
      tags: |
        ghcr.io/taktekhq/lebanese-legislation-vectors:latest
