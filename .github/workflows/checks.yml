name: checks
# Pull requests, and pushes to main (which then publish -api, -mcp and -all).
# A branch push without a pull request runs nothing; a new commit on a pull
# request cancels the run for the previous one.
#
# Every job checks out without data/ (1.4 GB): only internal/indexing's test
# reads data/popular_texts.txt, which is kept. The db
# image, which bakes data/ into PostgreSQL, is tested by db.yml, only when its
# inputs change.
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: checks-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/data/*
            /data/popular_texts.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Scraper
        run: |
          python -m compileall -q scraper/ulscrape
          bash scraper/bin/check-archive_test.sh
      - name: Site scripts (legislation.js, language.js)
        run: node --test scripts/*.test.cjs
      - name: Site Worker (workers/static-site)
        run: node --test workers/static-site/test/*.test.mjs
      - name: Go tests without a database
        run: |
          go test -count=1 ./internal/release/... ./internal/embedding/... ./internal/hfhub/... \
            ./cmd/restore-release ./cmd/check-release ./cmd/build-release ./cmd/publish-release
      - name: db.yml starts for every package in the db image
        run: bash .github/scripts/db-paths-check.sh
  postgres:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/data/*
            /data/popular_texts.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: PostgreSQL image
        run: docker build -f db/Dockerfile --target postgres -t lebleg-test-postgres .
      - name: Start disposable PostgreSQL
        run: |
          docker run -d --name lebleg-test -p 127.0.0.1:55433:5432 -e POSTGRES_USER=lebleg -e POSTGRES_PASSWORD=test -e POSTGRES_DB=lebleg lebleg-test-postgres
          for i in $(seq 1 60); do docker exec lebleg-test pg_isready -h 127.0.0.1 -U lebleg && break; sleep 1; done
          # pg_dump and pg_restore 18.6, from the same image.
          mkdir -p /tmp/pg18-bin
          for client in pg_dump pg_restore; do
            printf '#!/bin/sh\nexec docker run --rm -i --network host -v /tmp:/tmp -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGSSLMODE -e PGPASSWORD -e PGOPTIONS --entrypoint %s lebleg-test-postgres "$@"\n' "$client" > "/tmp/pg18-bin/$client"
            chmod +x "/tmp/pg18-bin/$client"
          done
      - name: PostgreSQL tests
        # The first-boot test of the baked db image runs in db.yml.
        run: go test -count=1 ./internal/releasedb/...
        env:
          LEBLEG_RELEASE_TEST_DSN: postgres://lebleg:test@127.0.0.1:55433/lebleg
          LEBLEG_TEST_PGDUMP: /tmp/pg18-bin/pg_dump
          LEBLEG_TEST_PGRESTORE: /tmp/pg18-bin/pg_restore
  images:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/data/*
            /data/popular_texts.txt
          sparse-checkout-cone-mode: false
      - name: Build independent smoke images
        run: |
          ( set +e
            bash -e -o pipefail <<'TASK_API' > "$RUNNER_TEMP/api.log" 2>&1
          docker build --build-arg GIT_SHA=${{ github.sha }} -f api/Dockerfile -t lebleg-test-api .
          TASK_API
            echo $? > "$RUNNER_TEMP/api.status"
          ) &
          ( set +e
            bash -e -o pipefail <<'TASK_MCP' > "$RUNNER_TEMP/mcp.log" 2>&1
          docker build --build-arg GIT_SHA=${{ github.sha }} -f mcp/Dockerfile -t lebleg-test-mcp .
          TASK_MCP
            echo $? > "$RUNNER_TEMP/mcp.status"
          ) &
          ( set +e
            bash -e -o pipefail <<'TASK_WEB' > "$RUNNER_TEMP/web.log" 2>&1
          docker build --build-arg GIT_SHA=${{ github.sha }} -f web/Dockerfile -t lebleg-test-web .
          TASK_WEB
            echo $? > "$RUNNER_TEMP/web.status"
          ) &
          wait
          failed=0
          until [ -f "$RUNNER_TEMP/api.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/api.log"
          [ "$(cat "$RUNNER_TEMP/api.status")" -eq 0 ] || failed=1
          until [ -f "$RUNNER_TEMP/mcp.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/mcp.log"
          [ "$(cat "$RUNNER_TEMP/mcp.status")" -eq 0 ] || failed=1
          until [ -f "$RUNNER_TEMP/web.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/web.log"
          [ "$(cat "$RUNNER_TEMP/web.status")" -eq 0 ] || failed=1
          [ "$failed" -eq 0 ]
      - name: Image smoke checks
        env:
          API_IMAGE: lebleg-test-api
          MCP_IMAGE: lebleg-test-mcp
          WEB_IMAGE: lebleg-test-web
          SMOKE_ARCHITECTURES: amd64
        run: bash .github/scripts/smoke-images.sh
  serving:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: legislation
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d legislation"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      DEMO_DATABASE_URL: postgres://postgres@localhost:5432/legislation?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/data/*
            /data/popular_texts.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Load fictional fixture
        run: |
          for schema in web/schema/schema.sql web/schema/graph.sql web/schema/amendments.sql web/schema/official.sql web/schema/indexes.sql web/testdata/synthetic.sql; do
            psql "$DEMO_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$schema"
          done
          # search_term was made before the fixture's rows: count them
          psql "$DEMO_DATABASE_URL" -v ON_ERROR_STOP=1 -q -c 'REFRESH MATERIALIZED VIEW search_term'
      - run: go vet ./...
      - name: Remaining Go tests with the fictional database
        # The unit and postgres jobs run these excluded packages.
        run: |
          packages=$(go list ./... | grep -Ev '/internal/(release|embedding|hfhub|releasedb)(/|$)|/cmd/(restore-release|check-release|build-release|publish-release)$')
          go test -count=1 $packages
      - run: go build ./web ./api ./mcp
  ci-ok:
    runs-on: ubuntu-latest
    needs: [unit, postgres, images, serving]
    if: always()
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
  api:
    needs: ci-ok
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image: api
      context: .
      dockerfile: api/Dockerfile
      tags: |
        ghcr.io/taktekhq/lebanese-legislation-api:source-${{ github.sha }}
      platforms: linux/amd64,linux/arm64
  mcp:
    needs: ci-ok
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image: mcp
      context: .
      dockerfile: mcp/Dockerfile
      tags: |
        ghcr.io/taktekhq/lebanese-legislation-mcp:source-${{ github.sha }}
      platforms: linux/amd64,linux/arm64
  # A push that changes data/ also runs data.yml, which bakes the database and
  # builds the all-in-one image from it. Built here too, the image would hold
  # the database from before the push, and origin.yml would stage it first:
  # on 7 Nov 2026 new code met the old schema (no search_term) and the warm
  # checks failed for 40 minutes before the right image could deploy.
  data-run:
    needs: ci-ok
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      actions: read
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/github-script@v7
        id: check
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'data.yml', head_sha: context.sha, event: 'push', per_page: 1,
            });
            if (runs.data.total_count > 0) {
              core.setOutput('exists', 'true');
              return;
            }
            // No data run for this commit, but an earlier commit's data run may
            // still be building the database this code needs. Building now uses
            // the old `latest` db image, and its deploy warm-up 500s for 30
            // minutes (7 Nov: 52df4ac, a CI-only commit, merged 3 minutes after
            // #177's schema change). Wait for every data run on main to finish.
            const deadline = Date.now() + 90 * 60 * 1000;
            for (;;) {
              const all = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'data.yml', branch: 'main', event: 'push', per_page: 20,
              });
              const pending = all.data.workflow_runs.filter(r => r.status !== 'completed');
              if (!pending.length) break;
              if (Date.now() > deadline) {
                core.setFailed(`data run ${pending[0].id} still ${pending[0].status} after 90 minutes`);
                return;
              }
              core.info(`waiting for data run ${pending[0].id} (${pending[0].head_sha.slice(0, 7)}, ${pending[0].status})`);
              await new Promise(r => setTimeout(r, 30000));
            }
            core.setOutput('exists', 'false');
  all:
    needs: [ci-ok, data-run]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.data-run.outputs.exists != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image: all
      context: .
      dockerfile: workers/static-site/container/Dockerfile
      tags: |
        ghcr.io/taktekhq/lebanese-legislation-all:latest
      # the -db-prod tag -all is built from
      build_args: |
        DATA_TAG=latest
      free_disk: true
