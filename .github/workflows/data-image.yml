name: data-image
'on':
  workflow_dispatch: null
  workflow_run:
    workflows:
    - vectors
    types:
    - completed
permissions:
  contents: read
  packages: write
concurrency:
  group: data-image
  cancel-in-progress: false
jobs:
  image:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v4
    - name: Free disk
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        docker system prune -af
    - name: Download dumps and scans
      env:
        AWS_DEFAULT_REGION: auto
        AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      run: |
        build=workers/static-site/container/build
        mkdir -p "$build/scans"
        endpoint=https://5f012a200d9622ea6aecef1a02693e26.r2.cloudflarestorage.com
        export build endpoint
        ( set +e
          bash -e -o pipefail <<'TASK_DUMP' > "$RUNNER_TEMP/dump.log" 2>&1
        aws s3 cp s3://lebleg-site/_build/lebleg.dump "$build/lebleg.dump" --endpoint-url "$endpoint"
        TASK_DUMP
          echo $? > "$RUNNER_TEMP/dump.status"
        ) &
        ( set +e
          bash -e -o pipefail <<'TASK_SEARCH' > "$RUNNER_TEMP/search.log" 2>&1
        aws s3 cp s3://lebleg-site/_build/lebleg_search.dump "$build/lebleg_search.dump" --endpoint-url "$endpoint"
        TASK_SEARCH
          echo $? > "$RUNNER_TEMP/search.status"
        ) &
        ( set +e
          bash -e -o pipefail <<'TASK_SCANS' > "$RUNNER_TEMP/scans.log" 2>&1
        aws s3 sync s3://lebleg-site/_build/scans "$build/scans" --endpoint-url "$endpoint"
        TASK_SCANS
          echo $? > "$RUNNER_TEMP/scans.status"
        ) &
        wait
        failed=0
        until [ -f "$RUNNER_TEMP/dump.status" ]; do sleep 1; done
        cat "$RUNNER_TEMP/dump.log"
        [ "$(cat "$RUNNER_TEMP/dump.status")" -eq 0 ] || failed=1
        until [ -f "$RUNNER_TEMP/search.status" ]; do sleep 1; done
        cat "$RUNNER_TEMP/search.log"
        [ "$(cat "$RUNNER_TEMP/search.status")" -eq 0 ] || failed=1
        until [ -f "$RUNNER_TEMP/scans.status" ]; do sleep 1; done
        cat "$RUNNER_TEMP/scans.log"
        [ "$(cat "$RUNNER_TEMP/scans.status")" -eq 0 ] || failed=1
        [ "$failed" -eq 0 ]
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push data image
      run: |
        tag=$(date -u +%F)
        image=ghcr.io/taktekhq/lebanese-legislation-data
        docker build -f workers/static-site/container/data.Dockerfile -t "$image:$tag" -t "$image:latest" workers/static-site/container
        docker push "$image:$tag"
        docker push "$image:latest"
        echo "Data image tag: $tag" >> "$GITHUB_STEP_SUMMARY"
