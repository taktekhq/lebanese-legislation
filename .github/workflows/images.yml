name: MCP runtime image
on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['Dockerfile', 'scripts/mcp_release.py', 'scripts/smoke-mcp.sh', '.github/workflows/images.yml']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: API version, or auto to follow the latest published API
        required: false
        default: auto
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-mcp-image
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin the published API and choose matching MCP release
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          requested=${REQUESTED_VERSION:-auto}
          if [ "$GITHUB_REF_TYPE" = tag ]; then requested=${GITHUB_REF_NAME#v}; fi
          ref=latest
          if [ "$requested" != auto ]; then ref=$requested; fi
          api=ghcr.io/taktekhq/lebanese-legislation-api
          API_DIGEST=$(docker buildx imagetools inspect "$api:$ref" --format '{{ .Manifest.Digest }}')
          export API_IMAGE="$api@$API_DIGEST"
          docker pull "$API_IMAGE"
          API_VERSION=$(docker run --rm --entrypoint python "$API_IMAGE" -c 'from lebleg_starter import __version__; print(__version__)')
          export API_DIGEST API_VERSION
          export REQUESTED_VERSION=$requested
          python3 scripts/mcp_release.py
          echo "api_image=$API_IMAGE" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        if: steps.version.outputs.build == 'true' && steps.version.outputs.skip != 'true'
        with:
          context: .
          target: mcp
          build-args: API_IMAGE=${{ steps.version.outputs.api_image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/taktekhq/lebanese-legislation-mcp:${{ steps.version.outputs.candidate }}
          labels: |
            org.opencontainers.image.source=https://github.com/taktekhq/lebanese-legislation
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.lebleg.api-image=${{ steps.version.outputs.api_image }}
      - name: Verify both MCP variants
        if: steps.version.outputs.skip != 'true'
        env:
          MCP_IMAGE: ghcr.io/taktekhq/lebanese-legislation-mcp:${{ steps.version.outputs.candidate }}
          MCP_EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/smoke-mcp.sh
      - name: Promote verified MCP version
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CANDIDATE: ${{ steps.version.outputs.candidate }}
          BUILD_IMAGE: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          image=ghcr.io/taktekhq/lebanese-legislation-mcp
          if [ "$BUILD_IMAGE" = true ]; then
            docker buildx imagetools create --tag "$image:$VERSION" "$image:$CANDIDATE"
          fi
          docker buildx imagetools create --tag "$image:latest" "$image:$VERSION"
