name: publish images
on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to publish
        type: choice
        default: all
        options: [db, db-prod, api, mcp, all, vectors]
permissions:
  contents: read
  packages: write
jobs:
  db:
    if: inputs.image == 'db'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image: db
      context: .
      dockerfile: db/Dockerfile
      tags: |
        ghcr.io/taktekhq/lebanese-legislation-db:latest
      free_disk: true
  db-prod:
    if: inputs.image == 'db-prod'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image: db-prod
      context: .
      dockerfile: db/prod/Dockerfile
      tags: |
        ghcr.io/taktekhq/lebanese-legislation-db-prod:latest
      build_args: |
        DATA_TAG=latest
      free_disk: true
  api:
    if: inputs.image == 'api'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image: api
      context: .
      dockerfile: api/Dockerfile
      tags: |
        ghcr.io/taktekhq/lebanese-legislation-api:source-${{ github.sha }}
      platforms: linux/amd64,linux/arm64
  mcp:
    if: inputs.image == 'mcp'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image: mcp
      context: .
      dockerfile: mcp/Dockerfile
      tags: |
        ghcr.io/taktekhq/lebanese-legislation-mcp:source-${{ github.sha }}
      platforms: linux/amd64,linux/arm64
  all:
    if: inputs.image == 'all'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image: all
      context: .
      dockerfile: workers/static-site/container/Dockerfile
      tags: |
        ghcr.io/taktekhq/lebanese-legislation-all:latest
      # the -db-prod tag -all is built from
      build_args: |
        DATA_TAG=latest
      free_disk: true
  vectors:
    if: inputs.image == 'vectors'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image: vectors
      context: .
      dockerfile: vectors/Dockerfile
      tags: |
        ghcr.io/taktekhq/lebanese-legislation-vectors:latest