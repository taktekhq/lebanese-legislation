name: publish images
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/postgres.Dockerfile
          push: true
          tags: ghcr.io/taktekhq/lebanese-legislation-starter:postgres-18.6-vector0.8.2
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: true
          tags: ghcr.io/taktekhq/lebanese-legislation-starter:0.1.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: publisher
          push: true
          tags: ghcr.io/taktekhq/lebanese-legislation-starter:publisher-0.1.0
