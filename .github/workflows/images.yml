name: publish images
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish from this ref
        required: true
        default: 0.1.3
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-container-package
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate immutable image versions
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          else
            test "$REQUESTED_VERSION" = "$VERSION"
          fi
          export VERSION
          python3 - <<'PYCODE'
          import json, os, urllib.request, urllib.error
          tags = set()
          for page in range(1, 101):
              url = f'https://api.github.com/orgs/taktekhq/packages/container/lebanese-legislation-starter/versions?per_page=100&page={page}'
              request = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      versions = json.load(response)
              except urllib.error.HTTPError as error:
                  if error.code == 404 and page == 1:
                      break
                  raise
              tags.update(tag for version in versions for tag in version['metadata']['container']['tags'])
              if len(versions) < 100:
                  break
          else:
              raise SystemExit('Package version listing exceeded safety bound')
          version = os.environ['VERSION']
          if tags.intersection({version, 'publisher-'+version}):
              raise SystemExit('Refusing to replace published version tags')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('version='+version+'\n')
              out.write('build_postgres='+str('postgres-18.6-vector0.8.2-r2' not in tags).lower()+'\n')
          PYCODE
      - uses: docker/build-push-action@v6
        if: steps.version.outputs.build_postgres == 'true'
        with:
          context: .
          file: docker/postgres.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/taktekhq/lebanese-legislation-starter:postgres-18.6-vector0.8.2-r2
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/taktekhq/lebanese-legislation-starter:${{ steps.version.outputs.version }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: publisher
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/taktekhq/lebanese-legislation-starter:publisher-${{ steps.version.outputs.version }}

      - name: Smoke test both published architectures
        env:
          POSTGRES_IMAGE: ghcr.io/taktekhq/lebanese-legislation-starter:postgres-18.6-vector0.8.2-r2
          STARTER_IMAGE: ghcr.io/taktekhq/lebanese-legislation-starter:${{ steps.version.outputs.version }}
          PUBLISHER_IMAGE: ghcr.io/taktekhq/lebanese-legislation-starter:publisher-${{ steps.version.outputs.version }}
        run: bash docker/smoke-images.sh
