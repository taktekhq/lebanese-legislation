name: publish images
on:
  workflow_dispatch:
    inputs:
      image:
        description: Image to publish
        type: choice
        default: all
        options: [db, api, mcp, all, vectors]
permissions:
  contents: read
  packages: write
jobs:
  db:
    if: inputs.image == 'db'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image: db
      context: .
      dockerfile: db/Dockerfile
      tags: |
        ghcr.io/taktekhq/lebanese-legislation-db:latest
      free_disk: true
      pre_build: |
        aws s3 sync s3://lebleg-site/_build/scans db/scans --endpoint-url https://5f012a200d9622ea6aecef1a02693e26.r2.cloudflarestorage.com
  api:
    if: inputs.image == 'api'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image: api
      context: .
      dockerfile: api/Dockerfile
      tags: |
        ghcr.io/taktekhq/lebanese-legislation-api:source-${{ github.sha }}
      platforms: linux/amd64,linux/arm64
  mcp:
    if: inputs.image == 'mcp'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image: mcp
      context: .
      dockerfile: mcp/Dockerfile
      tags: |
        ghcr.io/taktekhq/lebanese-legislation-mcp:source-${{ github.sha }}
      platforms: linux/amd64,linux/arm64
  all:
    if: inputs.image == 'all'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image: all
      context: .
      dockerfile: workers/static-site/container/Dockerfile
      tags: |
        ghcr.io/taktekhq/lebanese-legislation-all:latest
      build_args: |
        DATA_TAG=latest
  vectors:
    if: inputs.image == 'vectors'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image: vectors
      context: .
      dockerfile: vectors/Dockerfile
      tags: |
        ghcr.io/taktekhq/lebanese-legislation-vectors:latest