name: publish images
on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish from this ref
        required: true
        default: 0.1.6
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
concurrency:
  group: publish-container-package
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate immutable image versions
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          else
            test "$REQUESTED_VERSION" = "$VERSION"
          fi
          export VERSION
          python3 - <<'PYCODE'
          import json, os, urllib.request, urllib.error
          version = os.environ['VERSION']
          source_tag = 'source-' + os.environ['GITHUB_SHA']
          builds = {}
          for service in ('db', 'api', 'mcp'):
              package = 'lebanese-legislation-' + service
              builds[service] = True
              for page in range(1, 101):
                  url = f'https://api.github.com/orgs/taktekhq/packages/container/{package}/versions?per_page=100&page={page}'
                  request = urllib.request.Request(url, headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'], 'Accept':'application/vnd.github+json'})
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          versions = json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code == 404 and page == 1:
                          break
                      raise
                  occupied = [item for item in versions if version in item['metadata']['container']['tags']]
                  if occupied:
                      if len(occupied) != 1 or source_tag not in occupied[0]['metadata']['container']['tags']:
                          raise SystemExit(f'Refusing to replace published {package}:{version} from another source')
                      builds[service] = False
                      break
                  if len(versions) < 100:
                      break
              else:
                  raise SystemExit('Package version listing exceeded safety bound')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('version='+version+'\n')
              for service, build in builds.items():
                  out.write('build_'+service+'='+str(build).lower()+'\n')
          PYCODE
      - name: Build database candidate
        if: steps.version.outputs.build_db == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: db
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/taktekhq/lebanese-legislation-db:source-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Build API candidate
        if: steps.version.outputs.build_api == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/taktekhq/lebanese-legislation-api:source-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Build MCP candidate
        if: steps.version.outputs.build_mcp == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          target: mcp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/taktekhq/lebanese-legislation-mcp:source-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Check both candidate architectures before release tags
        env:
          DB_IMAGE: ghcr.io/taktekhq/lebanese-legislation-db:source-${{ github.sha }}
          API_IMAGE: ghcr.io/taktekhq/lebanese-legislation-api:source-${{ github.sha }}
          MCP_IMAGE: ghcr.io/taktekhq/lebanese-legislation-mcp:source-${{ github.sha }}
        run: bash docker/smoke-images.sh

      - name: Promote verified immutable versions
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          BUILD_DB: ${{ steps.version.outputs.build_db }}
          BUILD_API: ${{ steps.version.outputs.build_api }}
          BUILD_MCP: ${{ steps.version.outputs.build_mcp }}
        run: |
          for service in db api mcp; do
            image="ghcr.io/taktekhq/lebanese-legislation-$service"
            build_var="BUILD_${service^^}"
            if [ "${!build_var}" = true ]; then
              docker buildx imagetools create --tag "$image:$VERSION" "$image:source-$SOURCE_SHA"
            fi
          done
          for service in db api mcp; do
            image="ghcr.io/taktekhq/lebanese-legislation-$service"
            docker buildx imagetools create --tag "$image:latest" "$image:$VERSION"
          done
