name: test
# web/ (the website) and examples/.
on:
  push:
  pull_request:
jobs:
  serving:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: legislation
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d legislation"
          --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      DEMO_DATABASE_URL: postgres://postgres@localhost:5432/legislation?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: web/go.mod
      - name: Load fictional fixture
        run: |
          for schema in web/schema/schema.sql web/schema/graph.sql web/schema/amendments.sql web/schema/official.sql web/schema/indexes.sql web/testdata/synthetic.sql; do
            psql "$DEMO_DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$schema"
          done
      - run: go test ./...
        working-directory: web
      - run: go build ./cmd/website
        working-directory: web
      - run: docker build -f web/Dockerfile -t lebleg-test-web .

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test examples/handwriting/test.mjs examples/cloudflare-mcp/runtime.test.mjs
