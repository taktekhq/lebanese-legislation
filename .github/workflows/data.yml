name: data
# The database in data/: load it into PostgreSQL from the text files, export the
# Hugging Face Parquet tables, check the row counts, and compare with the dataset
# on Hugging Face. The Parquet tables are kept as an artifact for a week.
#
# The publish job uploads them, with the dataset card, to Hugging Face. It runs
# on main (push, or workflow_dispatch with publish=true) and only when the
# HF_TOKEN secret (in the huggingface environment) is set; without it, it says
# so and uploads nothing. Run it on your own machine with act (see docs/ci.md):
#   act workflow_dispatch -W .github/workflows/data.yml --input publish=true -s HF_TOKEN
on:
  pull_request:
    paths: ["data/**", ".github/workflows/data.yml", ".github/scripts/data-*.sh"]
  push:
    branches: [main]
    paths: ["data/**", ".github/workflows/data.yml", ".github/scripts/data-*.sh"]
  workflow_dispatch:
    inputs:
      publish:
        description: Upload the tables to Hugging Face (needs the HF_TOKEN secret)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    concurrency:
      group: data-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 90
    env:
      DATABASE_URL: postgresql://postgres:ci@127.0.0.1:5432/lebleg
    steps:
      - uses: actions/checkout@v4
      - name: Start DuckDB installation and current Parquet download
        run: |
          ( set +e
            bash -e -o pipefail <<'TASK_DUCKDB' > "$RUNNER_TEMP/duckdb.log" 2>&1
          curl -fsSL -o "$RUNNER_TEMP/duckdb.zip" https://github.com/duckdb/duckdb/releases/download/v1.5.6/duckdb_cli-linux-amd64.zip
          unzip -q "$RUNNER_TEMP/duckdb.zip" -d "$RUNNER_TEMP/bin"
          TASK_DUCKDB
            echo $? > "$RUNNER_TEMP/duckdb.status"
          ) &
          ( set +e
            bash -e -o pipefail <<'TASK_DATASET' > "$RUNNER_TEMP/dataset.log" 2>&1
          python3 -m venv "$RUNNER_TEMP/venv" && . "$RUNNER_TEMP/venv/bin/activate"
          pip install --quiet "huggingface_hub==1.33.0"
          python3 - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          snapshot_download("taktekhq/lebanese-legislation", repo_type="dataset", allow_patterns=["data/*.parquet"],
                            local_dir=os.path.join(os.environ["RUNNER_TEMP"], "hf"))
          PY
          TASK_DATASET
            echo $? > "$RUNNER_TEMP/dataset.status"
          ) &
      - name: Start PostgreSQL 18.6
        run: |
          # GitHub's runner has psql; act's smaller image does not.
          command -v psql >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null; }
          docker rm -f pg >/dev/null 2>&1 || true
          docker run -d --name pg -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=lebleg -p 127.0.0.1:5432:5432 \
            --shm-size=1g postgres:18.6 -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
            -c max_wal_size=8GB -c maintenance_work_mem=1GB
          for i in $(seq 60); do docker exec pg pg_isready -U postgres -d lebleg -q && break; sleep 1; done
          psql --version
      - name: Load the database
        run: time data/load.sh "$DATABASE_URL"
      - name: Wait for DuckDB
        run: |
          failed=0
          until [ -f "$RUNNER_TEMP/duckdb.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/duckdb.log"
          [ "$(cat "$RUNNER_TEMP/duckdb.status")" -eq 0 ] || failed=1
          [ "$failed" -eq 0 ]
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Export Parquet
        run: .github/scripts/data-parquet.sh "$DATABASE_URL" "$RUNNER_TEMP/parquet"
      - name: Wait for current Parquet
        run: |
          failed=0
          until [ -f "$RUNNER_TEMP/dataset.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/dataset.log"
          [ "$(cat "$RUNNER_TEMP/dataset.status")" -eq 0 ] || failed=1
          [ "$failed" -eq 0 ]
      - name: Check
        run: .github/scripts/data-check.sh "$RUNNER_TEMP/parquet" "$RUNNER_TEMP/hf/data" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: parquet
          path: ${{ runner.temp }}/parquet
          retention-days: 7
  publish:
    concurrency:
      group: data-publish-${{ github.ref }}
      cancel-in-progress: true
    needs: build
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
    # HF_TOKEN lives only in this environment, which deploys from main only. The
    # token is scoped on Hugging Face to write on this one dataset.
    environment: huggingface
    timeout-minutes: 30
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: taktekhq/lebanese-legislation
    steps:
      - name: Need HF_TOKEN
        id: token
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "No HF_TOKEN secret: nothing uploaded." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: actions/download-artifact@v4
        if: steps.token.outputs.ok == 'true'
        with:
          name: parquet
          path: ${{ runner.temp }}/out/data
      - name: Upload to Hugging Face
        if: steps.token.outputs.ok == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && . "$RUNNER_TEMP/venv/bin/activate"
          pip install --quiet "huggingface_hub==1.33.0"
          curl -fsS "https://huggingface.co/datasets/$HF_REPO/raw/main/README.md" -o "$RUNNER_TEMP/live.md" || true
          python3 .github/scripts/hf-card.py .github/huggingface/README.md "$RUNNER_TEMP/live.md" "$RUNNER_TEMP/out/README.md"
          hf upload "$HF_REPO" "$RUNNER_TEMP/out" . --repo-type dataset \
            --commit-message "Data from $(git rev-parse --short=12 HEAD), $(date -u +%F)"
          echo "Published https://huggingface.co/datasets/$HF_REPO" | tee -a "$GITHUB_STEP_SUMMARY"
  db:
    needs: publish
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image: db
      context: .
      dockerfile: db/Dockerfile
      tags: |
        ghcr.io/taktekhq/lebanese-legislation-db:latest
      free_disk: true
  dump:
    # PostgreSQL dumps of both databases from the -db image this run just
    # built, to one fixed path on Hugging Face that each run overwrites
    # (postgres/). Old versions stay in the dataset's git history. No
    # embeddings: semantic vectors are in the -vectors image and Vectorize.
    needs: db
    if: github.ref == 'refs/heads/main'
    environment: huggingface
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: taktekhq/lebanese-legislation
      IMAGE: ghcr.io/taktekhq/lebanese-legislation-db:latest
    steps:
      - name: Need HF_TOKEN
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "No HF_TOKEN secret: no dump uploaded." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /
      - name: Pull the -db image built from this commit
        run: |
          docker pull "$IMAGE"
          rev=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")
          # A stale :latest once shipped old code under a new name: refuse
          # anything but this commit's build.
          if [ "$rev" != "$GITHUB_SHA" ]; then
            echo "::error::$IMAGE is from ${rev:-an unknown commit}, not $GITHUB_SHA"
            exit 1
          fi
      - name: Start PostgreSQL
        run: |
          docker run -d --name db -e POSTGRES_PASSWORD=dump "$IMAGE"
          for i in $(seq 180); do
            docker exec -u postgres db pg_isready -q && \
              docker exec -u postgres db psql -d lebleg -Atc 'SELECT 1' >/dev/null 2>&1 && exit 0
            sleep 5
          done
          docker logs db | tail -50
          exit 1
      - name: Dump both databases
        run: |
          out="$RUNNER_TEMP/postgres"; mkdir -p "$out"
          for d in lebleg lebleg_search; do
            docker exec -u postgres db pg_dump -Fc -d "$d" > "$out/$d.dump"
          done
          ls -l "$out"
          python3 - "$out" <<'PY'
          import hashlib, json, os, subprocess, sys, datetime
          out = sys.argv[1]
          def sha(p):
              h = hashlib.sha256()
              with open(p, "rb") as f:
                  for b in iter(lambda: f.read(1 << 20), b""):
                      h.update(b)
              return h.hexdigest()
          pg = subprocess.check_output(["docker", "exec", "db", "pg_dump", "--version"], text=True).split()[-1]
          files = {}
          for name in ("lebleg.dump", "lebleg_search.dump"):
              p = os.path.join(out, name)
              files[name] = {"bytes": os.path.getsize(p), "sha256": sha(p)}
          manifest = {"commit": os.environ["GITHUB_SHA"], "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "image": os.environ["IMAGE"], "pg_dump": pg, "format": "custom (pg_restore)", "embeddings": False, "files": files}
          with open(os.path.join(out, "manifest.json"), "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          print(json.dumps(manifest, indent=2))
          PY
      - name: Upload to Hugging Face
        run: |
          python3 -m venv "$RUNNER_TEMP/venv" && . "$RUNNER_TEMP/venv/bin/activate"
          pip install --quiet "huggingface_hub==1.33.0"
          hf upload "$HF_REPO" "$RUNNER_TEMP/postgres" postgres --repo-type dataset \
            --commit-message "PostgreSQL dumps from ${GITHUB_SHA::12}, $(date -u +%F)"
          echo "Dumps: https://huggingface.co/datasets/$HF_REPO/tree/main/postgres" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Stop PostgreSQL
        if: always()
        run: docker rm -f db >/dev/null 2>&1 || true
  all:
    needs: db
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    secrets: inherit
    with:
      image: all
      context: .
      dockerfile: workers/static-site/container/Dockerfile
      tags: |
        ghcr.io/taktekhq/lebanese-legislation-all:latest
      build_args: |
        DATA_TAG=latest
