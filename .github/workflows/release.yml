name: release
# The PostgreSQL + pgvector release on Hugging Face (releases/<id>/corpus.dump,
# its manifest.json, and releases/latest.json), built from data/ with the
# release commands (cmd/build-release, cmd/restore-release, cmd/publish-release)
# inside the db image's publisher target, beside PostgreSQL 18.6 clients.
#
# 1. Load data/ into PostgreSQL (data/load.sh).
# 2. Restore the latest published release, to reuse its vectors.
# 3. Build: copy the public tables, reuse unchanged vectors, embed what changed
#    with Gemini (GEMINI_API_KEY; capped by max_new_embeddings, max_input_tokens
#    and $1 a day), validate, dump. Without GEMINI_API_KEY it says so and stops.
# 4. Restore the new dump into a fresh database and run every check.
# 5. Publish (HF_TOKEN), refusing to replace a release newer than the one the
#    build reused. Without HF_TOKEN it says so and uploads nothing.
#
# Run it on our own machine with act (see docs/ci.md). --bind keeps the work in
# .release/ of the checkout, so the downloaded dump and the daily budget
# ledgers stay between runs:
#   act workflow_dispatch -W .github/workflows/release.yml --bind \
#     -P ubuntu-24.04=ghcr.io/catthehacker/ubuntu:act-24.04 -s GEMINI_API_KEY -s HF_TOKEN
# On GitHub it needs the two secrets and a runner with about 60 GB of free disk.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to Hugging Face after the checks (needs the HF_TOKEN secret)
        type: boolean
        default: true
      max_new_embeddings:
        description: Refuse before any paid request when more chunks than this need vectors
        default: "20000"
      max_input_tokens:
        description: Input token budget for this run (empty for none; the $1 a day cap still applies)
        default: ""
  # Later, to release after every data change on main:
  # push:
  #   branches: [main]
  #   paths: ["data/**"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    # HF_TOKEN lives only in the huggingface environment, which deploys from main
    # only; on other branches the job runs without it and builds without publishing.
    environment: ${{ github.ref == 'refs/heads/main' && 'huggingface' || '' }}
    timeout-minutes: 600
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO: taktekhq/lebanese-legislation
      TOOLS: lebleg-release-tools:${{ github.run_id }}
      NET: lebleg-release-${{ github.run_id }}
      PG: lebleg-release-${{ github.run_id }}
    steps:
      - name: Need GEMINI_API_KEY
        id: keys
        env:
          WANT_PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "No GEMINI_API_KEY secret: no release built, nothing published." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "build=true" >> "$GITHUB_OUTPUT"
          if [ "$WANT_PUBLISH" != true ]; then
            echo "Publishing not asked for: the release will be built and checked only." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$HF_TOKEN" ]; then
            echo "No HF_TOKEN secret: the release will be built and checked, not published." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.build == 'true'
      - name: Name the release
        id: name
        if: steps.keys.outputs.build == 'true'
        run: |
          # The commit, and the data/ tree: the same data always gets the same id.
          id="auto-$(git rev-parse --short=12 HEAD)-$(git rev-parse HEAD:data | cut -c1-12)"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "day=$(TZ=Asia/Beirut date +%F)" >> "$GITHUB_OUTPUT"
          latest=$(curl -fsSL "https://huggingface.co/datasets/$HF_REPO/resolve/main/releases/latest.json" | sed -n 's/.*"release_id": *"\([^"]*\)".*/\1/p' || true)
          if [ "$latest" = "$id" ]; then
            echo "Release $id is already the latest: nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "todo=false" >> "$GITHUB_OUTPUT"
          else
            echo "Building $id (latest is ${latest:-none})." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "todo=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Keep the daily embedding budget between runs
        if: steps.name.outputs.todo == 'true' && !env.ACT
        uses: actions/cache@v4
        with:
          path: .release/budget
          key: embedding-budget-${{ steps.name.outputs.day }}-${{ github.run_id }}
          restore-keys: embedding-budget-${{ steps.name.outputs.day }}-
      - name: Build the tools image and start PostgreSQL
        if: steps.name.outputs.todo == 'true'
        run: |
          docker build -q -f db/Dockerfile --target publisher -t "$TOOLS" .
          docker network create "$NET" >/dev/null
          for db in source reuse staging verify; do
            docker run -d --name "$PG-$db" --network "$NET" --network-alias "$db" -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=lebleg \
              --shm-size=1g "$TOOLS" postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
              -c max_wal_size=8GB -c maintenance_work_mem=1GB >/dev/null
          done
          # Over TCP: the image's socket-only init server must not count as ready.
          for db in source reuse staging verify; do
            for i in $(seq 120); do docker exec "$PG-$db" pg_isready -h 127.0.0.1 -U postgres -d lebleg -q && break; sleep 1; done
          done
          mkdir -p .release/cache .release/budget && rm -rf .release/out
      - name: Load data/ and restore the latest release to reuse its vectors
        id: reuse
        if: steps.name.outputs.todo == 'true'
        run: |
          ( set +e
            bash -e -o pipefail <<'TASK_LOAD' > "$RUNNER_TEMP/load.log" 2>&1
          docker run --rm --network "$NET" -v "$GITHUB_WORKSPACE:/work:ro" "$TOOLS" \
            sh /work/data/load.sh "host=source user=postgres password=ci dbname=lebleg" | tail -n 3
          TASK_LOAD
            echo $? > "$RUNNER_TEMP/load.status"
          ) &
          ( set +e
            bash -e -o pipefail <<'TASK_REUSE' > "$RUNNER_TEMP/reuse.log" 2>&1
          docker run --rm --network "$NET" --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLS" \
            restore-release -db "host=reuse user=postgres password=ci dbname=lebleg" -reader-role "" \
            -repo "$HF_REPO" -cache-dir /work/.release/cache -web-sql /work/tools/src/lebleg/sql/web.sql
          previous=$(docker exec "$PG-reuse" psql -XtA -U postgres -d lebleg -c "SELECT release_id FROM lebleg_release")
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "Reusing the vectors of $previous." | tee -a "$GITHUB_STEP_SUMMARY"
          TASK_REUSE
            echo $? > "$RUNNER_TEMP/reuse.status"
          ) &
          wait
          failed=0
          until [ -f "$RUNNER_TEMP/load.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/load.log"
          [ "$(cat "$RUNNER_TEMP/load.status")" -eq 0 ] || failed=1
          until [ -f "$RUNNER_TEMP/reuse.status" ]; do sleep 1; done
          cat "$RUNNER_TEMP/reuse.log"
          [ "$(cat "$RUNNER_TEMP/reuse.status")" -eq 0 ] || failed=1
          [ "$failed" -eq 0 ]
      - name: Build the release
        if: steps.name.outputs.todo == 'true'
        env:
          RELEASE_ID: ${{ steps.name.outputs.id }}
          AS_OF: ${{ steps.name.outputs.day }}
          MAX_NEW: ${{ inputs.max_new_embeddings || '20000' }}
          MAX_TOKENS: ${{ inputs.max_input_tokens }}
        run: |
          budget=()
          if [ -n "$MAX_TOKENS" ]; then budget=(-max-input-tokens "$MAX_TOKENS" -embedding-budget-ledger /work/.release/run-budget.json); fi
          set +e
          docker run --rm --network "$NET" --user "$(id -u):$(id -g)" -e GEMINI_API_KEY -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLS" \
            build-release -db "host=staging user=postgres password=ci dbname=lebleg" \
            -source-db "host=source user=postgres password=ci dbname=lebleg" \
            -reuse-db "host=reuse user=postgres password=ci dbname=lebleg" \
            -repo "${{ github.repository }}" -revision "$(git rev-parse HEAD)" -release-id "$RELEASE_ID" -as-of "$AS_OF" \
            -out /work/.release/out -embed-missing -max-new-embeddings "$MAX_NEW" \
            -daily-embedding-budget-dir /work/.release/budget "${budget[@]}"
          code=$?
          set -e
          if [ -f .release/out/coverage.json ]; then
            { echo '```'; cat .release/out/coverage.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$code" = 2 ]; then
            echo "Chunks are still missing vectors (a cap or the daily budget stopped the build): nothing published." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          exit "$code"
      - name: Restore the new dump and check it
        if: steps.name.outputs.todo == 'true'
        run: |
          docker run --rm --network "$NET" --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLS" \
            restore-release -db "host=verify user=postgres password=ci dbname=lebleg" -reader-role "" \
            -manifest /work/.release/out/manifest.json -web-sql /work/tools/src/lebleg/sql/web.sql
      - name: Publish to Hugging Face
        if: steps.name.outputs.todo == 'true' && steps.keys.outputs.publish == 'true'
        env:
          PREVIOUS: ${{ steps.reuse.outputs.previous }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HF_TOKEN -v "$GITHUB_WORKSPACE:/work" -w /work "$TOOLS" \
            publish-release -dir /work/.release/out -repo "$HF_REPO" -expect-latest "$PREVIOUS" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Published https://huggingface.co/datasets/$HF_REPO/tree/main/releases" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && steps.name.outputs.todo == 'true' && !env.ACT
        with:
          name: release-manifest
          path: |
            .release/out/manifest.json
            .release/out/coverage.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Stop PostgreSQL
        if: always()
        run: |
          docker rm -f "$PG-source" "$PG-reuse" "$PG-staging" "$PG-verify" >/dev/null 2>&1 || true
          docker network rm "$NET" >/dev/null 2>&1 || true
          docker rmi "$TOOLS" >/dev/null 2>&1 || true
