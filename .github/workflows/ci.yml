name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # server/ (API, MCP, restore and publisher) and the db/ image.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install './server[build,test]'
      - run: ruff check server/src server/tests
      - run: docker build -f db/Dockerfile --target postgres -t lebleg-test-postgres .
      - name: Start disposable PostgreSQL
        run: |
          docker run -d --name lebleg-test -p 127.0.0.1:55433:5432 -e POSTGRES_USER=lebleg -e POSTGRES_PASSWORD=test -e POSTGRES_DB=lebleg lebleg-test-postgres
          for i in $(seq 1 60); do docker exec lebleg-test pg_isready -U lebleg && break; sleep 1; done
          mkdir -p /tmp/pg18-bin
          for client in pg_dump pg_restore; do
            printf '#!/bin/sh\nexec docker run --rm -i --network host -v /tmp:/tmp -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE:ro" -e PGHOST -e PGPORT -e PGUSER -e PGDATABASE -e PGSSLMODE -e PGPASSWORD -e PGOPTIONS --entrypoint %s lebleg-test-postgres "$@"\n' "$client" > "/tmp/pg18-bin/$client"
            chmod +x "/tmp/pg18-bin/$client"
          done
          echo '/tmp/pg18-bin' >> "$GITHUB_PATH"
      - run: docker build -f db/Dockerfile --target db -t lebleg-test-db .
      - run: docker build -f server/Dockerfile --target api -t lebleg-test-api .
      - run: docker build -f server/Dockerfile --target mcp -t lebleg-test-mcp .
      - run: docker build -f web/Dockerfile -t lebleg-test-web .
      - run: pytest -q
        working-directory: server
        env:
          LEBLEG_PIPELINE_IMAGE_TEST: "1"
          LEBLEG_TEST_ADMIN_DSN: host=127.0.0.1 port=55433 user=lebleg password=test dbname=lebleg
          RUNTIME_TEST_DSN: host=127.0.0.1 port=55433 user=lebleg password=test dbname=lebleg
          LEBLEG_TEST_IMAGE: lebleg-test-postgres
          LEBLEG_TEST_DB_IMAGE: lebleg-test-db
          LEBLEG_TEST_API_IMAGE: lebleg-test-api
          LEBLEG_TEST_MCP_IMAGE: lebleg-test-mcp
          LEBLEG_TEST_WEB_IMAGE: lebleg-test-web
          PG_DUMP_BIN: /tmp/pg18-bin/pg_dump
          LEBLEG_TEST_PGDUMP: /tmp/pg18-bin/pg_dump
          LEBLEG_TEST_PGRESTORE: /tmp/pg18-bin/pg_restore
          PG_RESTORE_BIN: /tmp/pg18-bin/pg_restore
      - run: docker build -f db/Dockerfile --target publisher -t lebleg-test-publisher .
