<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
<title>Cursor: add the server to mcp.json</title>
<rect width="640" height="300" rx="12" fill="#f6f4ef"/>
<rect x="0.5" y="0.5" width="639" height="299" rx="12" fill="none" stroke="#d9d4c8"/>
<circle cx="22" cy="20" r="5" fill="#e0b9a8"/><circle cx="40" cy="20" r="5" fill="#e6d49a"/><circle cx="58" cy="20" r="5" fill="#b7d1b0"/>
<rect x="16" y="44" width="608" height="150" rx="8" fill="#1d2420"/><text x="32" y="68" font-size="12" fill="#9aa59f" font-family="ui-monospace,Menlo,Consolas,monospace">~/.cursor/mcp.json</text><g font-size="13" fill="#8fd1b9" font-family="ui-monospace,Menlo,Consolas,monospace"><text x="32" y="92">{</text><text x="48" y="112">"mcpServers": {</text><text x="64" y="132">"lebanese-legislation": {</text><text x="80" y="152">"url": "https://lebaneselegislation.com/mcp"</text><text x="64" y="172">}</text><text x="48" y="188" dy="0">}</text></g><circle cx="600" cy="62" r="13" fill="#1f6f5c"/><text x="600" y="67" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text><rect x="16" y="208" width="608" height="76" rx="8" fill="#fff" stroke="#d9d4c8"/><text x="32" y="236" font-size="14" fill="#222">Cursor Settings, then Tools &amp; MCP: lebanese-legislation shows a green dot.</text><text x="32" y="262" font-size="12" fill="#6b665b">VS Code uses .vscode/mcp.json with "type": "http" instead.</text><circle cx="600" cy="222" r="13" fill="#1f6f5c"/><text x="600" y="227" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
</svg>
