[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lebanese-legislation"
version = "0.4.0"
description = "Restore, build and publish the Lebanese legal database (PostgreSQL and pgvector)"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Taktek and Nizar Mahmoud"}]
dependencies = ["psycopg[binary,pool]>=3.2,<4"]

[project.optional-dependencies]
build = ["pyarrow>=18", "huggingface_hub>=0.30,<2", "httpx>=0.27"]
test = ["pytest>=8", "httpx>=0.27", "ruff>=0.9"]

[project.scripts]
lebleg = "lebleg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lebleg = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
