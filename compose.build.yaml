# Build the images from this checkout instead of pulling them:
#   docker compose -f compose.yaml -f compose.build.yaml up -d --build
services:
  db:
    build: {context: ., dockerfile: db/Dockerfile, target: db}
  api:
    build: {context: ., dockerfile: server/Dockerfile, target: api}
  mcp:
    build: {context: ., dockerfile: server/Dockerfile, target: mcp}
  web:
    build: {context: ., dockerfile: web/Dockerfile}
