services:
  db:
    build:
      context: .
      dockerfile: docker/postgres.Dockerfile
  restore:
    build:
      context: .
      target: runtime
      args:
        POSTGRES_IMAGE: ${POSTGRES_IMAGE:-ghcr.io/taktekhq/lebanese-legislation-starter:postgres-18.6-vector0.8.2-r2}
  api:
    build:
      context: .
      target: runtime
      args:
        POSTGRES_IMAGE: ${POSTGRES_IMAGE:-ghcr.io/taktekhq/lebanese-legislation-starter:postgres-18.6-vector0.8.2-r2}
